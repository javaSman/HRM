<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{PAGE_TITLE}}</title>
<style>
  :root{
    --bg:#eaf4ff; --panel:#ffffff; --panel2:#e6f2fd; --line:#cfe4f7;
    --text:#1f3a57; --muted:#6a86a6; --accent:#1e9df0; --accent2:#0a7fc2;
    --sky:#38bdf8; --sky2:#0ea5e9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#e3f1ff 0%,#eef7ff 40%,#f4faff 100%) fixed;color:var(--text);font-size:14px;line-height:1.6}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  .app{display:flex;height:100vh;overflow:hidden}
  .side{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;height:100%}
  .brand{padding:18px 18px;background:linear-gradient(135deg,var(--sky),var(--sky2));color:#fff}
  .brand h1{margin:0;font-size:16px;letter-spacing:.5px;color:#fff}
  .brand p{margin:4px 0 0;color:rgba(255,255,255,.85);font-size:12px}
  .search{padding:10px 14px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);outline:none}
  .nav{overflow:auto;flex:1;padding:8px 0}
  .nav .home{margin:6px 12px 10px;padding:9px 12px;border-radius:8px;background:linear-gradient(90deg,var(--sky),var(--sky2));
    color:#fff;cursor:pointer;font-weight:600;text-align:center;box-shadow:0 2px 8px rgba(14,165,233,.25)}
  .menu-caption{padding:4px 16px 8px;color:var(--muted);font-size:10px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
  .menu-top{display:flex;align-items:center;gap:8px;padding:8px 14px 7px 16px;color:var(--text);font-size:13px;font-weight:650;border-left:3px solid transparent}
  .menu-top.has-action,.menu-entry.has-action{cursor:pointer}
  .menu-top.has-action:hover,.menu-entry.has-action:hover{background:var(--panel2);color:var(--accent2)}
  .menu-top.active{background:#d8edff;border-left-color:var(--accent);color:var(--accent2)}
  .menu-no{width:19px;color:#8ba6c0;font-size:10px;font-variant-numeric:tabular-nums}
  .menu-arrow{margin-left:auto;color:#8ba6c0;font-size:11px}
  .menu-children{padding:0 0 4px 0}
  .menu-entry{display:flex;align-items:center;gap:7px;min-height:28px;padding:5px 12px 5px 38px;color:#46647f;font-size:12px;border-left:3px solid transparent}
  .menu-entry.depth-2{padding-left:58px;font-size:11.5px;color:#6a86a6}
  .menu-entry .menu-path{display:block;margin-left:auto;max-width:94px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a2b5c8;font-size:9px}
  .menu-entry .menu-link-mark{color:var(--accent2);font-size:11px}
  .grp{padding:10px 16px 4px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px;
    display:flex;align-items:center;gap:8px}
  .grp .dot{width:8px;height:8px;border-radius:50%}
  .item{padding:8px 14px 8px 28px;cursor:pointer;color:var(--text);border-left:3px solid transparent;display:block}
  .item:hover{background:var(--panel2)}
  .item.active{background:#d8edff;border-left-color:var(--accent)}
  .item .nm{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item.active .nm{color:var(--accent2)}
  .item .tag{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .main{flex:1;overflow:auto;height:100%}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 22px 64px}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 34px;display:flex;justify-content:space-between;align-items:center}
  .topbar .crumb{color:var(--text);font-size:13px;font-weight:500}
  .topbar a.gitee{font-size:12px;border:1px solid var(--line);padding:5px 10px;border-radius:7px;color:var(--text)}
  .hero h2{font-size:24px;margin:0 0 6px}
  .hero .sub{color:var(--muted);margin-bottom:18px}
  .badges span{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:3px 9px;border-radius:20px;font-size:12px;margin:0 6px 6px 0}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0 26px}
  .stat{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat b{display:block;font-size:28px;color:var(--accent2)}
  .stat span{color:var(--muted);font-size:12px}
  .sec-title{font-size:15px;margin:26px 0 12px;padding-left:10px;border-left:3px solid var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
    transition:.15s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,165,233,.15)}
  .card .ct{font-weight:600;margin-bottom:5px}
  .card .cd{color:var(--muted);font-size:12px;line-height:1.5}
  .card .be{margin-top:8px;font-size:11px;color:var(--accent2)}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .panel-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
  .home-flow-panel{padding:9px 10px 10px;margin:8px 0 4px}
  .home-flow-panel #archbox{padding:0;margin:0;min-height:620px}
  .home-flow-panel #archbox svg{display:block;width:100%!important;height:auto!important;min-height:620px}
  .md h1{font-size:24px;border-bottom:1px solid var(--line);padding-bottom:10px;margin:0 0 16px}
  .md h2{font-size:19px;margin:26px 0 12px;padding-left:10px;border-left:3px solid var(--accent)}
  .md h3{font-size:16px;margin:20px 0 10px;color:#234b6e}
  .md h4{font-size:14px;margin:16px 0 8px;color:#37577a}
  .md p{margin:10px 0}
  .md code{background:#e7f1fc;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12.5px;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;color:#0b6cb0}
  .md pre{background:#f1f7fe;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
  .md pre code{background:none;border:none;color:#1f3a57;padding:0}
  .md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px;display:block;overflow:auto}
  .md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .md th{background:var(--panel2);color:#1f3a57}
  .md tr:nth-child(even) td{background:#f5faff}
  .md blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 14px;color:#516b88;background:var(--panel2);border-radius:0 8px 8px 0}
  .md ul,.md ol{padding-left:24px}
  .md li{margin:4px 0}
  .md hr{border:none;border-top:1px solid var(--line);margin:22px 0}
  .mermaid{background:#fbfdff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;text-align:center;overflow:auto}
  .flow-hint{display:inline-flex;align-items:center;margin-left:8px;padding:3px 8px;border-radius:999px;background:#e4f5ff;color:var(--accent2);font-size:11px;font-weight:500;vertical-align:middle}
  #archbox g.node.clickable-flow{cursor:pointer;transition:filter .15s,transform .15s}
  #archbox g.node.clickable-flow:hover{filter:drop-shadow(0 4px 7px rgba(14,165,233,.32)) brightness(1.03)}
  #archbox g.node.clickable-flow:focus{outline:2px solid var(--accent);outline-offset:4px}
  .flow-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:2px 0 18px}
  .flow-kicker{color:var(--accent2);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .flow-detail-head h2{margin:3px 0 5px;font-size:24px}
  .flow-detail-sub{color:var(--muted);margin:0;max-width:680px}
  .flow-back{border:1px solid var(--line);background:var(--panel);color:var(--accent2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}
  .flow-back:hover{background:#e5f4ff;border-color:var(--accent)}
  .flow-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:14px;align-items:start}
  .flow-layout .panel-box{margin:0}
  .flow-side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .flow-side h3{font-size:15px;margin:0 0 12px;color:#234b6e}
  .flow-side ul{padding:0;margin:0;list-style:none;display:grid;gap:9px}
  .flow-side li{position:relative;padding-left:19px;color:#45627e;font-size:12.5px;line-height:1.55}
  .flow-side li:before{content:'✓';position:absolute;left:0;top:0;color:var(--accent2);font-weight:700}
  .flow-link-note{color:var(--muted);font-size:12px;margin:0 0 12px}
  .flow-modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .flow-modules .card{min-height:96px}
  .menu-detail-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:14px;align-items:start}
  .menu-detail-layout .panel-box{margin:0}
  .menu-detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
  .menu-detail-panel h3{font-size:15px;margin:0 0 3px;color:#234b6e}
  .menu-detail-panel>p{margin:0 0 12px;color:var(--muted);font-size:11.5px}
  .menu-detail-list{display:grid;gap:6px;max-height:620px;overflow:auto;padding-right:2px}
  .menu-detail-item{display:flex;align-items:flex-start;gap:8px;padding:8px 9px;border:1px solid #e0edf7;border-radius:8px;background:#f8fcff;min-width:0}
  .menu-detail-item.depth-1{background:#fbfdff;padding-left:18px}
  .menu-detail-item.depth-2{background:#fff;padding-left:27px}
  .menu-detail-no{flex:0 0 22px;color:#8ba6c0;font-size:10px;font-variant-numeric:tabular-nums;padding-top:2px}
  .menu-detail-main{min-width:0;flex:1}
  .menu-detail-name{color:var(--text);font-size:12px;font-weight:600;line-height:1.4}
  .menu-detail-item.depth-1 .menu-detail-name,.menu-detail-item.depth-2 .menu-detail-name{font-weight:500;color:#45627e}
  .menu-detail-path{color:#9aafc2;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .menu-detail-actions{display:flex;gap:4px;flex:0 0 auto}
  .menu-detail-actions button{border:1px solid var(--line);background:#fff;color:var(--accent2);border-radius:6px;padding:3px 6px;cursor:pointer;font-size:10px;white-space:nowrap}
  .menu-detail-actions button:hover{border-color:var(--accent);background:#e5f4ff}
  .menu-detail-children{display:grid;gap:6px;margin-left:8px}
  .menu-flow-note{margin:12px 0 0;color:var(--muted);font-size:12px}
  .menu-board{display:grid;gap:10px}
  .menu-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(40,104,155,.04)}
  .menu-card-head{display:flex;align-items:center;gap:12px;min-height:28px}
  .menu-order{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#e4f5ff;color:var(--accent2);font-size:11px;font-weight:700}
  .menu-card-title{font-size:14px;font-weight:650;color:var(--text)}
  .menu-card-path{display:block;color:var(--muted);font-size:10px;margin-top:1px}
  .menu-card-action{margin-left:auto;border:1px solid var(--line);background:#f8fcff;color:var(--accent2);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px;font-weight:600}
  .menu-card-action:hover{border-color:var(--accent);background:#e5f4ff}
  .menu-children-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;margin:12px 0 0 40px}
  .menu-child{min-width:0;padding:8px 10px;border:1px solid #e0edf7;border-radius:8px;background:#f8fcff;color:#45627e;font-size:12px}
  .menu-child.depth-1{background:#fbfdff}
  .menu-child-label{display:flex;align-items:center;gap:6px;font-weight:550}
  .menu-child-path{display:block;color:#9aafc2;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .menu-child-mark{color:var(--accent2);font-size:11px}
  .menu-child .menu-children-grid{grid-template-columns:1fr;margin:7px 0 0 8px}
  .code-index{margin-top:26px;background:rgba(255,255,255,.48);border:1px solid var(--line);border-radius:12px;padding:0 16px 16px}
  .code-index summary{cursor:pointer;list-style:none;padding:14px 0;color:var(--text);font-size:15px;font-weight:650}
  .code-index summary::-webkit-details-marker{display:none}
  .code-index summary:after{content:'展开';float:right;color:var(--accent2);font-size:11px;font-weight:500}
  .code-index[open] summary:after{content:'收起'}
  .code-index .sec-title{margin-top:14px}
  @media (max-width:900px){.flow-layout,.menu-detail-layout{grid-template-columns:1fr}.flow-detail-head{flex-direction:column}.flow-back{order:-1}}
  .loaderr{color:#fca5a5;font-size:12px}
  @media (max-width:820px){.side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s;z-index:30}
    .side.open{transform:none}.menu-btn{display:inline-block!important}}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;cursor:pointer}
  .back-btn{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(90deg,var(--sky),var(--sky2));color:#fff;border:none;
    border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(14,165,233,.25)}
  .back-btn:hover{filter:brightness(1.06)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1>{{BRAND_NAME}}</h1>
      <p>{{BRAND_SUB}}</p>
    </div>
    <div class="search"><input id="q" placeholder="搜索模块…"/></div>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="main" id="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
        <button class="back-btn" id="backBtn" onclick="goHome()" style="display:none">← 返回总览</button>
        <span class="crumb" id="crumb">项目总览</span>
      </div>
      <a class="gitee" id="giteeLink" href="{{GITEE_HOME}}" target="_blank" rel="noopener">在 Gitee 查看 ↗</a>
    </div>
    <div class="wrap" id="content"></div>
  </div>
</div>

{{DATA}}

<script>
// ─── 从 META 读取分组配置 ──────────────────────────────────
var G = META.groups || {};
// 构建分组名→颜色映射（section.key → section.color）
var GROUP_COLOR = {};
var GROUP_ORDER = []; // [{side:'backend'|'frontend', sideLabel:'后端', sectionKey:'biz', sectionName:'业务模块', color:'#10b981'}]
['backend','frontend'].forEach(function(side){
  var sideConf = G[side];
  if(!sideConf) return;
  var sideLabel = sideConf.label || (side==='backend'?'后端':'前端');
  (sideConf.sections||[]).forEach(function(sec){
    GROUP_COLOR[sec.key] = sec.color || 'var(--accent)';
    GROUP_ORDER.push({
      side: side,
      sideLabel: sideLabel,
      sectionKey: sec.key,
      sectionName: sec.name || sec.key,
      color: sec.color || 'var(--accent)'
    });
  });
});

// stat 标签（可配置）
var SL = META.statLabels || {backend:'后端模块',frontend:'前端模块',mermaid:'流程图',docs:'文档'};

var marked_ready=false, mermaid_ready=false;

function loadScript(urls, cb){
  var i=0;
  (function next(){
    if(i>=urls.length){cb(new Error('all cdn failed'));return;}
    var s=document.createElement('script');s.src=urls[i++];
    s.onload=function(){cb(null);};s.onerror=next;
    document.head.appendChild(s);
  })();
}
loadScript([
  'https://cdn.staticfile.org/marked/4.3.0/marked.min.js',
  'https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js',
  'https://unpkg.com/marked@4.3.0/marked.min.js'
], function(e){ marked_ready=!e; if(currentSlug) renderDoc(currentSlug,true); else if(currentMenuKey) renderMenuDetail(currentMenuKey,true); else if(currentFlowKey) renderFlow(currentFlowKey,true); });
loadScript([
  'https://cdn.staticfile.org/mermaid/10.6.1/mermaid.min.js',
  'https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js',
  'https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js'
], function(e){ if(!e){ mermaid_ready=true; mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'loose',flowchart:{useMaxWidth:true,nodeSpacing:16,rankSpacing:24,padding:6}}); if(currentSlug || currentFlowKey || currentMenuKey) runMermaid(); else renderHomeArch(); } });

var currentSlug=null, currentMenuKey=null, currentFlowKey=null, mid=0;

// ─── 构建左侧导航：以登录后的真实菜单树为唯一顺序 ───────
function menuAction(item, topLevel){
  if(topLevel && item.key){
    if(item.key==='home')return 'goHome()';
    return 'openMenu(\''+item.key+'\')';
  }
  if(item.flow)return 'openFlow(\''+item.flow+'\')';
  if(item.doc)return 'openDoc(\''+item.doc+'\')';
  return '';
}
function renderMenuEntries(items, depth){
  var h='';
  (items||[]).forEach(function(item){
    var action=menuAction(item), children=item.children||[];
    var attrs=action?' class="menu-entry depth-'+depth+' has-action" onclick="'+action+'"':' class="menu-entry depth-'+depth+'"';
    h+='<div'+attrs+'><span>'+(item.name||'')+'</span>'+(action?'<span class="menu-link-mark">↗</span>':'')
      +(item.path?'<span class="menu-path">'+item.path+'</span>':'')+'</div>';
    if(children.length)h+='<div class="menu-children">'+renderMenuEntries(children,depth+1)+'</div>';
  });
  return h;
}
function buildNav(){
  var nav=document.getElementById('nav');var h='';
  h+='<div class="home" onclick="goHome()">项目总览</div><div class="menu-caption">平台一级菜单 · 实际顺序</div>';
  (META.menu||[]).forEach(function(item,index){
    var action=menuAction(item,true);
    var attrs=action?' class="menu-top has-action" onclick="'+action+'"':' class="menu-top"';
    h+='<div'+attrs+' data-menu-key="'+esc(item.key||'')+'"><span class="menu-no">'+String(index+1).padStart(2,'0')+'</span><span>'+item.name+'</span>'+(action?'<span class="menu-link-mark">↗</span>':'')+'</div>';
  });
  nav.innerHTML=h;
}

// ─── 扁平化模块列表（用于 findMeta） ────────────────────────
function flatList(){
  var out=[];
  GROUP_ORDER.forEach(function(g){
    var arr=(META[g.side]||{})[g.sectionKey]||[];
    arr.forEach(function(m){out.push([g.sectionKey,m,g.side]);});
  });
  return out;
}

// ─── 首页 ──────────────────────────────────────────────────
function goHome(){
  currentSlug=null; currentMenuKey=null; currentFlowKey=null; location.hash=''; setActive(null);
  document.getElementById('backBtn').style.display='none';
  document.getElementById('crumb').textContent='项目总览';
  document.getElementById('giteeLink').href='{{GITEE_HOME}}';
  var s=META.stats;
  var h='<div class="hero">'
    +'<h2>{{HERO_TITLE}} <span style="color:var(--muted);font-size:15px">{{HERO_TITLE_EXTRA}}</span></h2>'
    +'<div class="sub">{{HERO_SUB}}</div>'
    +'<div class="badges">{{TECH_BADGES}}</div>'
    +'</div>';
  h+='<div class="stats">'
    +'<div class="stat"><b>'+s.backend+'</b><span>'+SL.backend+'</span></div>'
    +'<div class="stat"><b>'+s.frontend+'</b><span>'+SL.frontend+'</span></div>'
    +'<div class="stat"><b>'+s.mermaid+'</b><span>'+SL.mermaid+'</span></div>'
    +'<div class="stat"><b>'+s.docs+'</b><span>'+SL.docs+'</span></div></div>';
  h+='<div class="sec-title">核心业务流程与模块关系 <span class="flow-hint">点击节点可下钻查看功能流程</span></div><div class="panel-box home-flow-panel"><div class="mermaid" id="archbox" data-arch="1">'+esc(ARCH)+'</div></div>';
  h+='<p class="menu-flow-note">首页以“一个人”为主线展示从招聘、入职建档、在职履职、日常申请到离职归档的完整信息流和业务流；点击图中模块节点，或点击左侧一级菜单，可继续下钻查看对应业务流程。</p>';
  h+='<details class="code-index"><summary>代码模块索引 <span class="flow-hint">按源码边界整理</span></summary>';
  // 代码模块索引保留在菜单清单之后，默认收起，避免与用户实际使用顺序混排
  GROUP_ORDER.forEach(function(g){
    var mods = flatModules(g.side, g.sectionKey);
    if(!mods.length) return;
    h+='<div class="sec-title">'+g.sideLabel+' · '+g.sectionName+' 点击查看文档</div>'+cards(mods, g.color);
  });
  h+='</details>';

  // 总索引
  var idxCards=[];
  if('{{INDEX_BACKEND_README}}') idxCards.push({slug:'ov-backend',name:'后端模块导航（{{INDEX_BACKEND_README}}）',desc:'后端模块依赖图与清单',grpColor:(GROUP_ORDER[0]||{}).color});
  if('{{INDEX_FRONTEND_README}}') idxCards.push({slug:'ov-frontend',name:'前端模块总索引（{{INDEX_FRONTEND_README}}）',desc:'前端 views 目录 → 功能模块映射',grpColor:(GROUP_ORDER.filter(function(g){return g.side==='frontend';})[0]||{}).color});
  if(idxCards.length) h+='<div class="sec-title">总索引</div>'+cards(idxCards);

  document.getElementById('content').innerHTML=h;
  document.getElementById('main').scrollTop=0;
  renderHomeArch();
}

function flatModules(side, sectionKey){
  return ((META[side]||{})[sectionKey]||[]).map(function(m){
    return Object.assign({grpColor: GROUP_COLOR[sectionKey] || 'var(--accent)'}, m);
  });
}

function renderMenuBoardChildren(items, depth){
  var h='';
  (items||[]).forEach(function(item){
    var action=menuAction(item), children=item.children||[];
    h+='<div class="menu-child depth-'+depth+'"><div class="menu-child-label"><span>'+esc(item.name||'')+'</span>'
      +(action?'<span class="menu-child-mark" title="打开流程或模块说明">↗</span>':'')+'</div>'
      +(item.path?'<span class="menu-child-path">'+esc(item.path)+'</span>':'');
    if(action)h+='<button class="menu-card-action" style="margin:6px 0 0;padding:3px 7px" onclick="'+action+'">打开关联说明</button>';
    if(children.length)h+='<div class="menu-children-grid">'+renderMenuBoardChildren(children,depth+1)+'</div>';
    h+='</div>';
  });
  return h;
}
function menuBoard(){
  var h='<div class="menu-board">';
  (META.menu||[]).forEach(function(item,index){
    var action=menuAction(item), children=item.children||[];
    h+='<section class="menu-card"><div class="menu-card-head"><span class="menu-order">'+String(index+1).padStart(2,'0')+'</span>'
      +'<div><div class="menu-card-title">'+esc(item.name||'')+'</div>'+(item.path?'<span class="menu-card-path">'+esc(item.path)+'</span>':'')+'</div>';
    if(action)h+='<button class="menu-card-action" onclick="'+action+'">查看流程 / 模块</button>';
    h+='</div>';
    if(children.length)h+='<div class="menu-children-grid">'+renderMenuBoardChildren(children,0)+'</div>';
    h+='</section>';
  });
  return h+'</div>';
}

// ─── 卡片渲染 ──────────────────────────────────────────────
function cards(arr){
  var h='<div class="cards">';
  arr.forEach(function(m){
    h+='<div class="card" onclick="openDoc(\''+m.slug+'\')"><div class="bar" style="background:'+(m.grpColor||'var(--accent)')+'"></div>'
      +'<div class="ct">'+m.name+'</div><div class="cd">'+(m.desc||'')+'</div>'
      +(m.be?'<div class="be">↳ 后端：'+m.be+'</div>':'')+'</div>';
  });
  return h+'</div>';
}

// ─── 路由与文档渲染 ────────────────────────────────────────
function openDoc(slug){ if(location.hash.replace(/^#/,'')===slug){ route(); } else { location.hash=slug; } }
function openFlow(key){ var target='flow-'+key; if(location.hash.replace(/^#/,'')===target){ route(); } else { location.hash=target; } }
function openMenu(key){ var target='menu-'+key; if(location.hash.replace(/^#/,'')===target){ route(); } else { location.hash=target; } }
window.addEventListener('hashchange', route);
function route(){
  var slug=decodeURIComponent(location.hash.replace(/^#/,''));
  if(!slug){goHome();return;}
  if(slug.indexOf('menu-')===0){renderMenuDetail(slug.slice(5),false);return;}
  if(slug.indexOf('flow-')===0){renderFlow(slug.slice(5));return;}
  renderDoc(slug,false);
}

function findMeta(slug){
  var all=flatList();
  for(var i=0;i<all.length;i++){if(all[i][1].slug===slug)return all[i][1];}
  if(slug==='ov-backend')return{slug:slug,name:'后端模块导航',gitee:'{{GITEE_RAW}}/{{INDEX_BACKEND_README}}'};
  if(slug==='ov-frontend')return{slug:slug,name:'前端模块总索引',gitee:'{{GITEE_RAW}}/{{INDEX_FRONTEND_README}}'};
  return null;
}

function renderDoc(slug, keep){
  if(!DOCS[slug]){goHome();return;}
  currentSlug=slug; currentMenuKey=null; currentFlowKey=null;
  var m=findMeta(slug);
  setActive(slug);
  document.getElementById('backBtn').style.display='inline-flex';
  document.getElementById('crumb').textContent=(m?m.name:slug);
  if(m&&m.gitee)document.getElementById('giteeLink').href=m.gitee;
  var c=document.getElementById('content');
  if(!marked_ready){
    c.innerHTML='<div class="loaderr">⏳ 正在加载 Markdown 渲染库（marked.js）… 若长时间无响应，可点击右上角"在 Gitee 查看"。</div><pre style="white-space:pre-wrap">'+esc(DOCS[slug])+'</pre>';
    return;
  }
  var html=marked.parse(DOCS[slug]);
  c.innerHTML='<div class="md">'+html+'</div>';
  c.querySelectorAll('code.language-mermaid').forEach(function(code){
    var div=document.createElement('div');div.className='mermaid';div.textContent=code.textContent;
    var pre=code.closest('pre');pre.parentNode.replaceChild(div,pre);
  });
  document.getElementById('main').scrollTop=0;
  runMermaid();
  document.getElementById('side').classList.remove('open');
}

function getFlow(key){ return (META.businessFlows||{})[key] || null; }
function getMenu(key){
  var menus=META.menu||[];
  for(var i=0;i<menus.length;i++)if(menus[i].key===key)return menus[i];
  return null;
}
function renderMenuDetailItems(items, depth){
  var h='';
  (items||[]).forEach(function(item,index){
    var children=item.children||[];
    h+='<div class="menu-detail-item depth-'+depth+'"><span class="menu-detail-no">'+String(index+1).padStart(2,'0')+'</span>'
      +'<div class="menu-detail-main"><div class="menu-detail-name">'+esc(item.name||'')+'</div>'
      +(item.path?'<div class="menu-detail-path">'+esc(item.path)+'</div>':'')+'</div><div class="menu-detail-actions">'
      +(item.flow?'<button onclick="openFlow(\''+item.flow+'\')">业务流程</button>':'')
      +(item.doc?'<button onclick="openDoc(\''+item.doc+'\')">模块说明</button>':'')+'</div></div>';
    if(children.length)h+='<div class="menu-detail-children">'+renderMenuDetailItems(children,depth+1)+'</div>';
  });
  return h;
}
function renderMenuDetail(key, keep){
  var menu=getMenu(key);
  if(!menu){goHome();return;}
  currentSlug=null; currentMenuKey=key; currentFlowKey=null; setActive(key);
  document.getElementById('backBtn').style.display='inline-flex';
  document.getElementById('crumb').textContent='平台菜单 / '+menu.name;
  document.getElementById('giteeLink').href='{{GITEE_HOME}}';
  var flow=getFlow(menu.flow)||(META.menuFlows||{})[key]||null;
  var diagram=flow&&flow.diagram?flow.diagram:'flowchart TB\n  A['+menu.name+'] --> B[进入菜单工作区]';
  var functions=flow&&flow.functions?flow.functions:[];
  var h='<div class="flow-detail-head"><div><div class="flow-kicker">平台一级菜单 · '+esc(menu.name||'')+'</div><h2>'+esc(menu.name||'')+'业务流程</h2><p class="flow-detail-sub">'+esc((flow&&flow.subtitle)||'按平台实际菜单顺序查看本菜单的业务流转与功能入口。')+'</p></div>'
    +'<button class="flow-back" onclick="goHome()">← 返回整体业务流程</button></div>';
  h+='<div class="menu-detail-layout"><div class="panel-box"><div class="mermaid" id="menubox">'+esc(diagram)+'</div>';
  if(functions.length){h+='<aside class="flow-side"><h3>本菜单功能范围</h3><ul>';functions.forEach(function(item){h+='<li>'+esc(item)+'</li>';});h+='</ul></aside>';}
  h+='</div><aside class="menu-detail-panel"><h3>实际子菜单</h3><p>按登录后平台左侧菜单顺序排列，点击条目可进入对应流程或模块说明。</p>';
  if((menu.children||[]).length){h+='<div class="menu-detail-list">'+renderMenuDetailItems(menu.children,0)+'</div>';}else{h+='<div class="menu-detail-item"><span class="menu-detail-no">—</span><div class="menu-detail-main"><div class="menu-detail-name">该一级菜单未展开子菜单</div><div class="menu-detail-path">'+esc(menu.path||'平台菜单入口')+'</div></div></div>';}
  h+='</aside></div>';
  document.getElementById('content').innerHTML=h;
  document.getElementById('main').scrollTop=0;
  runMermaid();
  document.getElementById('side').classList.remove('open');
}
function getModulesBySlug(slugs){
  var all=flatList(), out=[];
  (slugs||[]).forEach(function(slug){
    for(var i=0;i<all.length;i++){
      if(all[i][1].slug===slug){
        out.push(Object.assign({grpColor:GROUP_COLOR[all[i][0]]||'var(--accent)'},all[i][1]));
        break;
      }
    }
  });
  return out;
}

function renderFlow(key, keep){
  var flow=getFlow(key);
  if(!flow){goHome();return;}
  currentSlug=null; currentMenuKey=null; currentFlowKey=key; setActive(null);
  document.getElementById('backBtn').style.display='inline-flex';
  document.getElementById('crumb').textContent='业务流程 / '+flow.title;
  document.getElementById('giteeLink').href='{{GITEE_HOME}}';
  var moduleCards=getModulesBySlug(flow.moduleSlugs);
  var h='<div class="flow-detail-head">'
    +'<div><div class="flow-kicker">功能流程下钻</div><h2>'+esc(flow.title)+'</h2><p class="flow-detail-sub">'+esc(flow.subtitle||'')+'</p></div>'
    +'<button class="flow-back" onclick="goHome()">← 返回整体业务流程</button></div>';
  h+='<div class="flow-layout"><div class="panel-box"><div class="mermaid" id="flowbox">'+esc(flow.diagram||'')+'</div></div>';
  h+='<aside class="flow-side"><h3>本模块功能范围</h3><ul>';
  (flow.functions||[]).forEach(function(item){h+='<li>'+esc(item)+'</li>';});
  h+='</ul></aside></div>';
  if(moduleCards.length){
    h+='<div class="sec-title">关联代码模块</div><p class="flow-link-note">点击模块卡片可打开该模块的完整 README、接口说明和已有流程图。</p><div class="flow-modules">';
    moduleCards.forEach(function(m){h+='<div class="card" onclick="openDoc(\''+m.slug+'\')"><div class="bar" style="background:'+(m.grpColor||'var(--accent)')+'"></div><div class="ct">'+esc(m.name)+'</div><div class="cd">'+esc(m.desc||'')+'</div><div class="be">↳ '+esc(m.sub||'')+'</div></div>';});
    h+='</div>';
  }
  document.getElementById('content').innerHTML=h;
  document.getElementById('main').scrollTop=0;
  runMermaid();
  document.getElementById('side').classList.remove('open');
}

function runMermaid(){
  if(!mermaid_ready)return;
  var nodes=document.querySelectorAll('.mermaid:not([data-done])');
  if(!nodes.length)return;
  nodes.forEach(function(n){n.id='mm'+(mid++);n.setAttribute('data-done','1');});
  try{ var result=mermaid.run({nodes:nodes}); if(result&&result.then)result.then(enhanceArchNodes).catch(function(e){console.warn(e);}); else enhanceArchNodes(); }catch(e){ console.warn(e); }
}
function renderHomeArch(){
  var a=document.getElementById('archbox');
  if(a&&mermaid_ready&&!a.getAttribute('data-done')){a.id='mm'+(mid++);a.setAttribute('data-done','1');try{var result=mermaid.run({nodes:[a]});if(result&&result.then)result.then(enhanceArchNodes).catch(function(e){console.warn(e);});else enhanceArchNodes();}catch(e){}}
}

function enhanceArchNodes(){
  var map={R:'recruit',O:'onboarding',S:'employee_lifecycle',L:'lodging',P:'attendance_prepare',A:'attendance',X:'applications',C:'review',D:'review',Z:'offboarding',V:'visitor_meeting'};
  var chart=document.querySelector('.mermaid[data-arch="1"]');
  if(!chart)return;
  chart.querySelectorAll('svg g.node').forEach(function(node){
    if(node.getAttribute('data-flow-bound'))return;
    var match=(node.id||'').match(/^flowchart-([A-Z])-/), key=match&&map[match[1]];
    if(!key||!getFlow(key))return;
    node.setAttribute('data-flow-bound','1');node.setAttribute('data-flow-key',key);node.setAttribute('role','button');node.setAttribute('tabindex','0');
    node.setAttribute('aria-label','打开'+getFlow(key).title);
    var handler=function(){openFlow(key);};
    node.addEventListener('click',handler);node.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();}});
  });
}

function setActive(slug){
  document.querySelectorAll('.menu-top').forEach(function(it){
    it.classList.toggle('active', it.getAttribute('data-menu-key')===slug);
  });
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('q').addEventListener('input',function(e){
  var v=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.menu-top,.menu-entry').forEach(function(it){
    var hit=!v||it.textContent.toLowerCase().indexOf(v)>=0;
    it.style.display=hit?'':'none';
  });
});

buildNav();
route();
</script>
</body>
</html>
