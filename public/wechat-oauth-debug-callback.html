<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业微信接口调试</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 18px; background: #f3f6fb; color: #1f2937; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 8vh auto; padding: 28px; border: 1px solid #e5eaf1; border-radius: 12px; background: #fff; box-shadow: 0 8px 30px rgba(25, 42, 70, .07); }
    h1 { margin: 0 0 8px; color: #172b4d; font-size: 22px; }
    p { color: #718096; }
    label { display: block; margin: 18px 0 6px; color: #64748b; font-size: 12px; }
    textarea { width: 100%; min-height: 74px; padding: 10px 12px; border: 1px solid #d9e0ea; border-radius: 6px; color: #1f2937; font: 13px/1.5 SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; resize: vertical; }
    button, .button { display: inline-block; margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; text-decoration: none; }
    .empty { padding: 12px; border-radius: 6px; background: #fff7ed; color: #9a3412; }
    .hint { margin-top: 18px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>正在打开企业微信接口调试台…</h1>
    <p>OAuth 回调参数会带入完整调试台；此流程不会自动登录或修改当前浏览器登录态。</p>
    <div id="status" class="empty">正在进入调试台。如果没有自动跳转，请点击下方按钮。</div>
    <label for="code">授权 code</label>
    <textarea id="code" readonly></textarea>
    <button type="button" data-copy="code">复制 code</button>
    <label for="state">state</label>
    <textarea id="state" readonly></textarea>
    <button type="button" data-copy="state">复制 state</button>
    <a id="open-debug" class="button" href="/wechat/debug?wecomDebug=1">打开完整企微接口调试台</a>
    <p class="hint">调试台包含 OAuth、JS-SDK、通讯录、应用消息、打卡和回调验签/解密等接口。</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search)
      var code = params.get('code') || ''
      var state = params.get('state') || ''
      var debugUrl = new URL('/wechat/debug', window.location.origin)
      debugUrl.searchParams.set('wecomDebug', '1')
      document.getElementById('open-debug').href = debugUrl.toString()
      document.getElementById('status').textContent = code
        ? '已收到 OAuth code，正在进入调试台并自动填入。'
        : '未收到 OAuth code，正在打开调试台；你也可以在那里手动填写。'
      document.getElementById('code').value = code
      document.getElementById('state').value = state
      if (code) debugUrl.searchParams.set('oauthCode', code)
      if (state) debugUrl.searchParams.set('oauthState', state)
      window.location.replace(debugUrl.toString())
      document.querySelectorAll('button[data-copy]').forEach(function (button) {
        button.addEventListener('click', function () {
          var field = document.getElementById(button.getAttribute('data-copy'))
          field.focus()
          field.select()
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(field.value)
          } else {
            document.execCommand('copy')
          }
        })
      })
    })()
  </script>
</body>
</html>
