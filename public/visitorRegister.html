<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>来访自助登记</title>
  <link rel="icon" href="<%= BASE_URL %>logo.png">
  <style>
    html,
    body,
    #visitor-register-app {
      height: 100%;
      margin: 0px;
      padding: 0px;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #visitor-register-loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      background: linear-gradient(135deg, #f8fafd 0%, #eef2ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .visitor-register-loader {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: visitor-register-spin 1s linear infinite;
    }

    @keyframes visitor-register-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    window._CONFIG = {
      VUE_APP_API_BASE_URL: '',
      VUE_APP_CAS_BASE_URL: '',
      VUE_APP_ONLINE_BASE_URL: ''
    };
  </script>
</head>
<body>
  <div id="visitor-register-app">
    <div id="visitor-register-loader-wrapper">
      <div class="visitor-register-loader"></div>
    </div>
  </div>
</body>
</html>
