<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤数据统计与明细</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f7faff;
            color: #333;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }
        /* ========== 打卡记录弹窗 ========== */
        .modal-mask {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .detail-modal {
            width: 720px;
            max-height: 85vh;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            background: #3478d9;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            flex-shrink: 0;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }
        .close-top {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-top:hover {
            background: rgba(255,255,255,0.35);
        }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        /* 员工信息摘要 */
        .staff-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px dashed #d0dceb;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .summary-label {
            color: #888;
        }
        .summary-value {
            color: #333;
            font-weight: 500;
        }
        /* 打卡记录表格 */
        .clock-table-wrap {
            overflow-x: auto;
        }
        .clock-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .clock-table th {
            background: #f0f5ff;
            padding: 10px 12px;
            text-align: center;
            color: #5a6c7d;
            font-weight: 500;
            border-bottom: 1px solid #dde4f8;
            white-space: nowrap;
        }
        .clock-table td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid #f0f4f9;
        }
        .clock-table tbody tr:hover {
            background: #f8fbff;
        }
        .no-record {
            text-align: center;
            padding: 40px 0;
            color: #aaa;
            font-size: 15px;
        }
        .no-record i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        .modal-footer {
            padding: 14px 24px;
            text-align: right;
            border-top: 1px solid #e1ecff;
            flex-shrink: 0;
        }
        .btn-close-bottom {
            padding: 8px 20px;
            border: 1px solid #c0cde0;
            background: #f7faff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            color: #555;
        }
        .btn-close-bottom:hover {
            background: #eef5ff;
        }

        /* ========== 右侧主内容区（全宽） ========== */
        .right-top-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 12px;
            border-bottom: 1px solid #e1ecff;
            margin-bottom: 12px;
        }
        .right-main-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .right-time-show {
            font-size: 14px;
            color: #7398f0;
        }
        .main-content {
            flex: 1;
            padding: 12px 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* 统计卡片 */
        .stat-wrap {
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .stat-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid #e1ecff;
            border-radius: 10px;
            padding: 18px;
            position: relative;
        }
        .stat-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 4px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .card-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .card-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-icon {
            font-size: 24px;
        }
        .card-text {
            display: flex;
            flex-direction: column;
        }
        .stat-num {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 6px;
        }
        .stat-label {
            font-size: 14px;
            color: #8892a0;
        }
        .stat-desc {
            font-size: 13px;
            color: #b0b8c4;
            margin-top: 3px;
        }
        .card-total::before { background: #4096ff; }
        .card-total .card-icon-box { background: rgba(64, 150, 255, 0.1); }
        .card-total .card-icon, .card-total .stat-num { color: #4096ff; }
        .card-normal::before { background: #27ae60; }
        .card-normal .card-icon-box { background: rgba(39, 174, 96, 0.1); }
        .card-normal .card-icon, .card-normal .stat-num { color: #27ae60; }
        .card-late::before { background: #e67e22; }
        .card-late .card-icon-box { background: rgba(230, 126, 34, 0.1); }
        .card-late .card-icon, .card-late .stat-num { color: #e67e22; }
        .card-early::before { background: #9b59b6; }
        .card-early .card-icon-box { background: rgba(155, 89, 182, 0.1); }
        .card-early .card-icon, .card-early .stat-num { color: #9b59b6; }
        .card-lack::before { background: #3498db; }
        .card-lack .card-icon-box { background: rgba(52, 152, 219, 0.1); }
        .card-lack .card-icon, .card-lack .stat-num { color: #3498db; }
        .card-absent::before { background: #e74c3c; }
        .card-absent .card-icon-box { background: rgba(231, 76, 60, 0.1); }
        .card-absent .card-icon, .card-absent .stat-num { color: #e74c3c; }

        /* 筛选栏 */
        .tab-wrap {
            background: #fff;
            border: 1px solid #d0e3f0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(74,158,255,0.08);
            flex-shrink: 0;
        }
        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filter-left {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-right {
            display: flex;
            align-items: center;
        }
        .segment-container {
            position: relative;
            display: inline-flex;
            background-color: #f2f5fa;
            border-radius: 999px;
            padding: 4px;
        }
        .segment-container input {
            display: none;
        }
        .segment-label {
            padding: 7px 14px;
            font-size: 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            color: #5a6c7d;
            user-select: none;
        }
        .segment-container input:checked + .segment-label {
            background-color: #69a7ff;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(105, 167, 255, 0.2);
        }
        .segment-label:hover:not(input:checked + .segment-label) {
            color: #4096ff;
        }
        .filter-input {
            padding: 7px 10px;
            border: 1px solid #d0e3f0;
            border-radius: 4px;
            font-size: 14px;
            min-width: 150px;
            background: #f8fbff;
        }
        .filter-input:focus {
            outline: none;
            border-color: #69a7ff;
        }
        .btn {
            padding: 7px 16px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: #69a7ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #5096f8;
        }
        .btn-default {
            background: #e5e9f2;
            color: #444a58;
        }
        .btn-default:hover {
            background: #d6dce9;
        }

        /* 表格容器 */
        .table-wrap-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .table-container {
            background: #fff;
            border: 1px solid #d0e3f0;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(74,158,255,0.08);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
        }
        .data-table {
            border-collapse: collapse;
            font-size: 14px;
            min-width: 2400px;
            width: max-content;
        }
        .data-table th {
            background: #f8fbff;
            padding: 10px 6px;
            text-align: center;
            color: #5a6c7d;
            font-weight: 500;
            border-bottom: 1px solid #e8f1f8;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .data-table td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #f0f4f9;
            white-space: nowrap;
        }
        /* 所属部门列缩窄 */
        .data-table .col-dept {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 操作列像Excel冻结窗格，固定在右侧始终可见 */
        .data-table th.sticky-action,
        .data-table td.sticky-action {
            position: sticky;
            right: 0;
            z-index: 2;
            background: #fff;
            box-shadow: -4px 0 8px rgba(0,0,0,0.08);
        }
        .data-table th.sticky-action {
            background: #f8fbff;
            z-index: 3;
        }
        .data-table tbody tr:hover td.sticky-action {
            background-color: #f8fbff;
        }
        .data-table tbody tr:hover {
            background-color: #f8fbff;
        }
        .tag {
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 12px;
            display: inline-block;
        }
        .tag-normal { background: #d4f5e9; color: #27ae60; }
        .tag-late { background: #fef5e7; color: #e67e22; }
        .tag-early { background: #f0e6ff; color: #9b59b6; }
        .tag-lack { background: #e6f4ff; color: #3498db; }
        .tag-absent { background: #ffe0e0; color: #e74c3c; }
        .tag-leave { background: #ffecec; color: #dd4444; }
        .row-btn {
            padding: 4px 10px;
            border: 1px solid #b8d4fb;
            background: #f6faff;
            color: #4086e6;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .row-btn:hover {
            background: #e1edff;
            border-color: #82b3f2;
        }
        .page-wrap {
            text-align: center;
            padding: 12px 0;
            font-size: 14px;
            border-top: 1px solid #e8f1f8;
            flex-shrink: 0;
        }
        .page-wrap button {
            margin: 0 4px;
            padding: 4px 10px;
            border: 1px solid #d0e3f0;
            border-radius: 3px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .page-wrap button.active {
            background: #69a7ff;
            color: #fff;
            border-color: #69a7ff;
        }
    </style>
</head>
<body>
    <!-- 打卡记录弹窗 -->
    <div class="modal-mask" id="detailMask">
        <div class="detail-modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">打卡记录</div>
                <button class="close-top" id="closeModalTopBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalContent"></div>
            <div class="modal-footer">
                <button class="btn-close-bottom" id="closeModalBottomBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 主内容区（全宽） -->
    <div class="main-content">
        <!-- 顶部标题栏 -->
        <div class="right-top-title-bar">
            <div class="right-main-title">考勤数据统计与明细</div>
            <div class="right-time-show" id="currentTimeText"></div>
        </div>
        <!-- 统计卡片 -->
        <div class="stat-wrap">
            <div class="stat-board">
                <div class="stat-card card-total">
                    <div class="card-inner">
                        <div class="card-text">
                            <div class="stat-num" id="totalNum">0</div>
                            <div class="stat-label">在职总人数</div>
                            <div class="stat-desc">当前部门总人员</div>
                        </div>
                        <div class="card-icon-box">
                            <i class="fa-solid fa-users card-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="stat-card card-normal">
                    <div class="card-inner">
                        <div class="card-text">
                            <div class="stat-num" id="normalNum">0</div>
                            <div class="stat-label">正常出勤</div>
                            <div class="stat-desc">今日正常打卡</div>
                        </div>
                        <div class="card-icon-box">
                            <i class="fa-solid fa-circle-check card-icon"></i>

                </div>
                <div class="stat-card card-late">
                    <div class="card-inner">
                        <div class="card-text">
                            <div class="stat-num" id="lateNum">0</div>
                            <div class="stat-label">迟到</div>
                            <div class="stat-desc">今日迟到人员</div>

                            <i class="fa-solid fa-clock card-icon"></i>

                    </div>
                </div>
                <div class="stat-card card-early">
                    <div class="card-inner">
                        <div class="card-text">
                            <div class="stat-num" id="earlyNum">0</div>
                            <div class="stat-label">早退</div>
                            <div class="stat-desc">今日提前离岗</div>
                        </div>
                        <div class="card-icon-box">
                            <i class="fa-solid fa-hourglass-half card-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="stat-card card-lack">
                    <div class="card-inner">
                        <div class="card-text">
                            <div class="stat-num" id="lackNum">0</div>
                            <div class="stat-label">缺卡</div>
                            <div class="stat-desc">今日未打卡</div>
                        </div>
                        <div class="card-icon-box">
                            <i class="fa-solid fa-id-card card-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="stat-card card-absent">
                    <div class="card-inner">
                        <div class="card-text">
                            <div class="stat-num" id="absentNum">0</div>
                            <div class="stat-label">旷工</div>
                            <div class="stat-desc">今日缺勤旷工</div>
                        </div>
                        <div class="card-icon-box">
                            <i class="fa-solid fa-user-slash card-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 筛选栏 -->
        <div class="tab-wrap">
            <div class="filter-row">
                <div class="filter-left">
                    <input class="filter-input" placeholder="姓名 / 工号 搜索" id="searchInput">
                    <input class="filter-input" type="date" id="startDate" value="2026-06-22">
                    <span style="font-size:14px;color:#5a6c7d;">至</span>
                    <input class="filter-input" type="date" id="endDate" value="2026-06-22">
                    <button class="btn btn-primary" id="searchBtn">查询</button>
                    <button class="btn btn-default" id="resetBtn">重置</button>
                    <button class="btn btn-primary" id="exportBtn">导出数据</button>
                </div>
                <div class="filter-right">
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                        <span style="font-size:12px; color:#999;">默认选取当日数据</span>
                        <div class="segment-container" id="statusFilter">
                        <input type="radio" name="attendTab" id="tabAll" checked>
                        <label class="segment-label" for="tabAll">全部</label>
                        <input type="radio" name="attendTab" id="tabNormal">

                        <input type="radio" name="attendTab" id="tabLate">

                        <input type="radio" name="attendTab" id="tabEarly">

                        <input type="radio" name="attendTab" id="tabLack">

                        <input type="radio" name="attendTab" id="tabAbsent">
                        <label class="segment-label" for="tabAbsent">旷工</label>
                    </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 表格容器 -->
        <div class="table-wrap-container">
            <div class="table-container">
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>出勤状态</th>
                                <th>工号</th>
                                <th>姓名</th>

                                <th>星期</th>

                                <th>备注</th>
                                <th class="sticky-action">操作</th>

                        <tbody id="tableBody"></tbody>

                </div>
                <div class="page-wrap">

                    <button>2</button>
                    <button>3</button>
                    <button>下一页</button>
                    <span style="margin-left:10px;">共27页</span>
                </div>
            </div>
        </div>
    </div>

<script>

    // ==== 构建打卡记录列表（含打卡方式、是否补卡、状态） ====
    function buildClockRecords(staff) {
        const records = [];
        const clocks = [staff.clock1, staff.clock2, staff.clock3, staff.clock4, staff.clock5, staff.clock6];
        // 模拟打卡方式
        const methods = ["指纹打卡", "人脸识别", "手机打卡", "考勤机打卡"];
        // 模拟补卡状态
        const makeupOptions = ["否", "否", "否", "是", "否"];
        // 模拟状态
        const statusOptions = ["正常", "正常", "正常", "异常", "已补卡"];
        // 随机时间区间（确保递增）
        const timeRanges = [
            { hMin: 6, mMin: 0, hMax: 9, mMax: 30 },   // 打卡1
            { hMin: 11, mMin: 30, hMax: 13, mMax: 0 },  // 打卡2
            { hMin: 13, mMin: 0, hMax: 14, mMax: 30 },  // 打卡3
            { hMin: 16, mMin: 30, hMax: 19, mMax: 30 }, // 打卡4
            { hMin: 18, mMin: 0, hMax: 20, mMax: 0 },   // 打卡5
            { hMin: 19, mMin: 30, hMax: 22, mMax: 0 }   // 打卡6
        ];

        clocks.forEach((time, i) => {
            if (time !== "--") {
                const idx = records.length;
                const r = timeRanges[i];
                const totalMin = r.hMin * 60 + r.mMin + Math.floor(Math.random() * ((r.hMax * 60 + r.mMax) - (r.hMin * 60 + r.mMin) + 1));
                const hh = String(Math.floor(totalMin / 60)).padStart(2, "0");
                const mm = String(totalMin % 60).padStart(2, "0");
                records.push({
                    seq: idx + 1,
                    time: `${staff.date} ${hh}:${mm}`,
                    method: methods[idx % methods.length],
                    isMakeup: makeupOptions[idx % makeupOptions.length],
                    status: statusOptions[idx % statusOptions.length]
                });
            }
        });
        return records;
    }

    // ==== 渲染打卡记录弹窗 ====
    function openClockModal(staff) {
        modalTitle.innerText = `打卡记录 - ${staff.name}（${staff.code}）`;
        const records = buildClockRecords(staff);

        let recordHtml = "";
        if (records.length === 0) {
            recordHtml = `<div class="no-record">
                <i class="fa-regular fa-clock"></i>
                <div>当日无打卡记录</div>
            </div>`;
        } else {
            recordHtml = `
            <div class="clock-table-wrap">
                <table class="clock-table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>打卡时间</th>
                            <th>打卡方式</th>
                            <th>是否补卡</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${records.map(r => `
                            <tr>
                                <td>${r.seq}</td>
                                <td><strong>${r.time}</strong></td>
                                <td>${r.method}</td>
                                <td>${r.isMakeup}</td>
                                <td>${r.status}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>`;
        }

        modalContent.innerHTML = `
            <div class="staff-summary">
                <div class="summary-item"><span class="summary-label">姓名：</span><span class="summary-value">${staff.name}</span></div>
                <div class="summary-item"><span class="summary-label">工号：</span><span class="summary-value">${staff.code}</span></div>
                <div class="summary-item"><span class="summary-label">考勤卡号：</span><span class="summary-value">${staff.cardNo}</span></div>
                <div class="summary-item"><span class="summary-label">部门：</span><span class="summary-value">${staff.dept}</span></div>
                <div class="summary-item"><span class="summary-label">日期：</span><span class="summary-value">${staff.date} ${staff.week}</span></div>
                <div class="summary-item"><span class="summary-label">出勤状态：</span><span class="summary-value" style="color:${staff.status==='正常出勤'?'#27ae60':staff.status==='迟到'?'#e67e22':staff.status==='早退'?'#9b59b6':staff.status==='缺卡'?'#3498db':'#e74c3c'}">${staff.status}</span></div>
            </div>
            ${recordHtml}
        `;
        mask.style.display = 'flex';
    }

    // ==== 更新统计卡片 ====
    function updateStat(list) {
        const total = list.length;
        const normal = list.filter(s => s.status === "正常出勤").length;
        const late = list.filter(s => s.status === "迟到").length;
        const early = list.filter(s => s.status === "早退").length;
        const lack = list.filter(s => s.status === "缺卡").length;
        const absent = list.filter(s => s.status === "旷工").length;
        document.getElementById("totalNum").innerText = total;
        document.getElementById("normalNum").innerText = normal;
        document.getElementById("lateNum").innerText = late;
        document.getElementById("earlyNum").innerText = early;
        document.getElementById("lackNum").innerText = lack;
        document.getElementById("absentNum").innerText = absent;
    }

    // ==== 获取当前筛选的状态 ====
    function getActiveStatus() {
        const checked = document.querySelector('input[name="attendTab"]:checked');
        if (!checked) return "全部";
        const map = {
            tabAll: "全部", tabNormal: "正常出勤", tabLate: "迟到",
            tabEarly: "早退", tabLack: "缺卡", tabAbsent: "旷工"
        };
        return map[checked.id] || "全部";
    }

    // ==== 渲染表格 ====
    function updateTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        const searchText = (document.getElementById("searchInput").value || "").trim().toLowerCase();
        const activeStatus = getActiveStatus();
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;

        let filterList = [...allStaff];

        // 搜索过滤
        if (searchText) {
            filterList = filterList.filter(s =>
                s.name.toLowerCase().includes(searchText) ||
                s.code.toLowerCase().includes(searchText)
            );
        }
        // 状态过滤
        if (activeStatus !== "全部") {
            filterList = filterList.filter(s => s.status === activeStatus);
        }
        // 日期过滤
        if (startDate) {
            filterList = filterList.filter(s => s.date >= startDate);
        }
        if (endDate) {
            filterList = filterList.filter(s => s.date <= endDate);
        }

        updateStat(filterList);

        filterList.forEach(staff => {
            const tr = document.createElement("tr");
            let tagClass = "";
            if (staff.status === "正常出勤") tagClass = "tag-normal";
            if (staff.status === "迟到") tagClass = "tag-late";
            if (staff.status === "早退") tagClass = "tag-early";
            if (staff.status === "缺卡") tagClass = "tag-lack";
            if (staff.status === "旷工") tagClass = "tag-absent";

            tr.innerHTML = `
                <td><span class="tag ${tagClass}">${staff.status}</span></td>
                <td>${staff.code}</td>
                <td>${staff.name}</td>
                <td>${staff.bigDept}</td>
                <td class="col-dept">${staff.dept}</td>
                <td>${staff.cardNo}</td>
                <td>${staff.date}</td>
                <td>${staff.week}</td>
                <td>${staff.clock1}</td>
                <td>${staff.clock2}</td>
                <td>${staff.clock3}</td>
                <td>${staff.clock4}</td>
                <td>${staff.clock5}</td>
                <td>${staff.clock6}</td>
                <td>${staff.baseHour}</td>
                <td>${staff.over15}</td>
                <td>${staff.over2}</td>
                <td>${staff.over3}</td>
                <td>${staff.totalHour}</td>
                <td>${staff.lateMin}</td>
                <td>${staff.isLeave}</td>
                <td>${staff.remark || "-"}</td>
                <td class="sticky-action"><button class="row-btn clock-btn">打卡记录</button></td>
            `;
            tbody.appendChild(tr);

            // 打卡记录按钮
            const clockBtn = tr.querySelector('.clock-btn');
            clockBtn.addEventListener('click', () => openClockModal(staff));
        });
    }

    // ==== 筛选事件 ====
    // 搜索按钮
    document.getElementById("searchBtn").addEventListener("click", updateTable);
    // 搜索框回车
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") updateTable();
    });
    // 重置按钮
    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        document.getElementById("startDate").value = "2026-06-22";
        document.getElementById("endDate").value = "2026-06-22";
        document.getElementById("tabAll").checked = true;
        updateTable();
    });
    // 选项卡切换
    document.querySelectorAll('input[name="attendTab"]').forEach(radio => {
        radio.addEventListener("change", updateTable);
    });
    // 导出按钮
    document.getElementById("exportBtn").addEventListener("click", () => {
        alert("导出功能：将导出当前筛选结果到 Excel 文件");
    });

    // ==== 页面初始化 ====
    window.onload = function () {
        const now = new Date();
        const formatDate = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
        document.getElementById("currentTimeText").innerText = `当前日期：${formatDate}`;
        updateTable();
    };
</script>
