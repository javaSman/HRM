        }

            color: #333;

        /* ========== 处理弹窗 ========== */
        .modal-mask {
            position: fixed;
            left: 0;
            top: 0;

            display: none;
            align-items: center;
            justify-content: center;

        }
        .detail-modal {

            box-shadow: 0 4px 20px rgba(0,0,0,0.15);

        }
        .close-top {

            font-size: 16px;

            background: #f8fbff;

        }
        .form-group select:disabled,

            background: #f0f0f0;
            color: #888;
            cursor: not-allowed;
        }
        .radio-group {
            display: flex;
            gap: 24px;
            padding: 4px 0;
        }
        .radio-label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;

            cursor: not-allowed;
        }

            color: #999;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

            border: 1px solid #d0e3f0;

            font-size: 14px;
            background: #f8fbff;
            outline: none;

        }
        .form-group input[type="time"]:read-only {
            background: #f0f0f0;
            color: #888;
            cursor: not-allowed;
        }

            width: 100%;
            padding: 5px 10px;
            border: 1px solid #d0e3f0;
            border-radius: 6px;
            font-size: 14px;
            background: #f8fbff;
            outline: none;
        }
        .form-group input[type="file"]:disabled {
            background: #f0f0f0;
            color: #888;
            cursor: not-allowed;
        }
        .clock-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px;
        }
        .modal-footer {
            padding: 14px 24px;
            text-align: right;
            border-top: 1px solid #e1ecff;
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;

        .btn-close-bottom {
            padding: 8px 20px;
            border: 1px solid #c0cde0;
            background: #f7faff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            color: #555;
        }
        .btn-close-bottom:hover {
            background: #eef5ff;
        }
        .btn-submit {
            padding: 8px 20px;
            border: none;
            background: #1890FF;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background: #40a9ff;
        }

        .right-top-title-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 10px 0 12px;
            border-bottom: 1px solid #e1ecff;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;

            font-size: 20px;
            font-weight: 600;
            color: #333;
            flex-shrink: 0;

            color: #1890FF;

        }

            color: #5a6c7d;

        .data-table td {

            overflow: hidden;
            text-overflow: ellipsis;

        .data-table .col-week { width: 6%; }
        .data-table .col-dept { width: 16%; }
        .data-table .col-pos { width: 10%; }
        .data-table .col-code { width: 8%; }
        .data-table .col-company { width: 10%; }
        .data-table .col-name { width: 6%; }
        .data-table .col-abnormal { width: 18%; }
        .data-table .col-status { width: 8%; }
        .data-table .col-action { width: 8%; }

            border-radius: 8px;

        .tag-lack { background: #e6f4ff; color: #3498db; }
        .tag-absent { background: #ffe0e0; color: #e74c3c; }
        .tag-pending { background: #fff5e6; color: #f39c12; }
        .tag-done { background: #d4f5e9; color: #27ae60; }

        .row-btn {
            padding: 4px 10px;
            border: 1px solid #1890FF;
            background: #e6f7ff;
            color: #1890FF;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;

            background: #f5f5f5;
            color: #999;

        .row-btn.done:hover {

            border-color: #a0a0a0;

        .row-btn.approve-btn {

            background: #f6ffed;
            color: #52c41a;
        }
        .row-btn.approve-btn:hover {
            background: #d9f7be;
            border-color: #73d13d;
        }

            padding: 12px 0;
            font-size: 14px;
            border-top: 1px solid #e8f1f8;
            flex-shrink: 0;

            margin: 0 4px;
            padding: 4px 10px;
            border: 1px solid #d0e3f0;
            border-radius: 3px;
            background: #fff;
            cursor: pointer;

        }

            color: #fff;
            border-color: #1890FF;
        }
        .abnormal-desc {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e74c3c;

            bigDept: "事业二部", company: "三烨&维玺&维德",
            date: "2026-06-24", week: "周三",
            clock1: "08:45", clock2: "--", clock3: "--", clock4: "18:20", clock5: "--", clock6: "--",
            baseHour: "8.00 h", over15: "0 h", over2: "0 h", over3: "0 h",
            totalHour: "6.50 h", lateMin: "0 分钟", status: "缺卡", isLeave: "否", remark: "工作日",
            abnormalDesc: "上午下班缺卡", handleStatus: "待处理"
        },
        {
            name: "陈十三", code: "EMP013", dept: "工业机器人研发部", position: "硬件工程师",
            bigDept: "事业一部", company: "旭益达",
            date: "2026-06-25", week: "周四",
            clock1: "08:30", clock2: "12:05", clock3: "13:30", clock4: "15:45", clock5: "--", clock6: "--",
            baseHour: "8.00 h", over15: "0 h", over2: "0 h", over3: "0 h",
            totalHour: "5.80 h", lateMin: "0 分钟", status: "早退", isLeave: "是", remark: "工作日",
            abnormalDesc: "下午下班早退2小时", handleStatus: "待处理"
        },
    ];


    // ==== 获取当前筛选的状态 ====
    function getActiveStatus() {
        return document.getElementById("attendStatusSelect").value;
    }


    // ==== 打开处理弹窗 ====
    function openHandleModal(staff) {
        currentHandleStaff = staff;
        modalTitle.innerText = `异常处理 - ${staff.name}（${staff.code}）`;

        let statusColor = "";
        if (staff.status === "迟到") statusColor = "#e67e22";
        if (staff.status === "早退") statusColor = "#9b59b6";
        if (staff.status === "缺卡") statusColor = "#3498db";
        if (staff.status === "旷工") statusColor = "#e74c3c";

        const isDone = staff.handleStatus === "已处理";

        modalContent.innerHTML = `
            <div class="staff-summary">
                <div class="summary-item"><span class="summary-label">姓名：</span><span class="summary-value">${staff.name}</span></div>
                <div class="summary-item"><span class="summary-label">工号：</span><span class="summary-value">${staff.code}</span></div>
                <div class="summary-item"><span class="summary-label">日期：</span><span class="summary-value">${staff.date} ${staff.week}</span></div>
                <div class="summary-item"><span class="summary-label">部门：</span><span class="summary-value">${staff.dept}</span></div>
                <div class="summary-item"><span class="summary-label">岗位：</span><span class="summary-value">${staff.position}</span></div>
                <div class="summary-item"><span class="summary-label">出勤状态：</span><span class="summary-value" style="color:${statusColor};font-weight:600;">${staff.status}</span></div>
            </div>
            <div class="handle-section">
                <div class="section-title">处理操作</div>
                <div class="form-group">
                    <label>处理说明</label>
                    <textarea id="handleRemarkInput" placeholder="请填写处理说明..." ${isDone ? 'readonly' : ''}>${isDone ? (staff.remark || '') : ''}</textarea>
                </div>
                <div class="form-group">
                    <label>处理附件</label>
                    <input type="file" id="handleAttachmentInput" ${isDone ? 'disabled' : ''}>
                </div>
                <div class="clock-grid">
                    <div class="form-group">
                        <label>打卡时间1</label>
                        <input type="time" id="clockTime1" value="${staff.clock1 !== '--' ? staff.clock1 : ''}" ${isDone ? 'readonly' : ''}>
                    </div>
                    <div class="form-group">
                        <label>打卡时间2</label>
                        <input type="time" id="clockTime2" value="${staff.clock2 !== '--' ? staff.clock2 : ''}" ${isDone ? 'readonly' : ''}>
                    </div>
                    <div class="form-group">
                        <label>打卡时间3</label>
                        <input type="time" id="clockTime3" value="${staff.clock3 !== '--' ? staff.clock3 : ''}" ${isDone ? 'readonly' : ''}>
                    </div>
                    <div class="form-group">
                        <label>打卡时间4</label>
                        <input type="time" id="clockTime4" value="${staff.clock4 !== '--' ? staff.clock4 : ''}" ${isDone ? 'readonly' : ''}>
                    </div>
                    <div class="form-group">
                        <label>打卡时间5</label>
                        <input type="time" id="clockTime5" value="${staff.clock5 !== '--' ? staff.clock5 : ''}" ${isDone ? 'readonly' : ''}>
                    </div>
                    <div class="form-group">
                        <label>打卡时间6</label>
                        <input type="time" id="clockTime6" value="${staff.clock6 !== '--' ? staff.clock6 : ''}" ${isDone ? 'readonly' : ''}>
                    </div>
                </div>
                <div class="form-group">
                    <label>处理状态</label>
                    <select id="handleStatusSelect" disabled>
                        <option value="待处理" selected>待处理</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>异常说明</label>
                    <textarea id="handleDescInput" readonly>${staff.abnormalDesc}</textarea>
                </div>
            </div>
        `;

        mask.style.display = 'flex';

        // 已处理时隐藏确认按钮
        submitHandleBtn.style.display = isDone ? 'none' : 'inline-block';

        // 提交处理按钮事件
        submitHandleBtn.onclick = function () {
            const handleRemark = document.getElementById('handleRemarkInput').value.trim();

            if (!handleRemark) {
                alert('请填写处理说明');
                return;
            }

            // 收集打卡时间
            const clockTimes = [];
            for (let i = 1; i <= 6; i++) {
                const timeVal = document.getElementById('clockTime' + i).value.trim();
                if (timeVal) {
                    clockTimes.push(timeVal);
                }
            }

            // 更新员工数据 - 标记为已处理
            staff.handleStatus = '已处理';

            // 保存打卡时间到员工记录
            for (let i = 1; i <= 6; i++) {
                const timeVal = document.getElementById('clockTime' + i).value.trim();
                staff['clock' + i] = timeVal || '--';
            }

            // 在 remark 中追加处理说明和打卡时间信息
            let remarkExtra = '处理说明：' + handleRemark;
            if (clockTimes.length > 0) {
                remarkExtra += '；打卡时间：' + clockTimes.join(', ');
            }
            staff.remark = (staff.remark && !staff.remark.includes('处理说明') ? staff.remark + '；' : '') + remarkExtra;

            closeModal();
            updateTable(); // 刷新表格
        };
    }


    // ==== 渲染表格 ====
    function updateTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        const nameText = (document.getElementById("nameInput").value || "").trim().toLowerCase();
        const codeText = (document.getElementById("codeInput").value || "").trim().toLowerCase();
        const monthVal = document.getElementById("monthSelect").value;
        const activeStatus = getActiveStatus();
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;
        const companyVal = document.getElementById("companySelect").value;

        let filterList = [...allAbnormalStaff];

        // 公司过滤
        if (companyVal) {
            filterList = filterList.filter(s => s.company === companyVal);
        }
        // 姓名过滤
        if (nameText) {
            filterList = filterList.filter(s => s.name.toLowerCase().includes(nameText));
        }
        // 工号过滤
        if (codeText) {
            filterList = filterList.filter(s => s.code.toLowerCase().includes(codeText));
        }
        // 月份过滤
        if (monthVal) {
            filterList = filterList.filter(s => s.date.startsWith(monthVal));
        }
        // 状态过滤
        if (activeStatus !== "") {
            filterList = filterList.filter(s => s.status === activeStatus);
        }


        filterList.forEach(staff => {
            const tr = document.createElement("tr");

            let handleTagClass = "tag-pending";
            const isDone = false;

            let attendTagClass = "";
            if (staff.status === "迟到") attendTagClass = "tag-late";
            else if (staff.status === "早退") attendTagClass = "tag-early";
            else if (staff.status === "缺卡") attendTagClass = "tag-lack";
            else if (staff.status === "旷工") attendTagClass = "tag-absent";

            tr.innerHTML = `
                <td><span class="tag ${attendTagClass}">${staff.status}</span></td>
                <td>${staff.date}</td>
                <td>${staff.week}</td>
                <td>${staff.code}</td>
                <td>${staff.company || '--'}</td>
                <td>${staff.dept}</td>
                <td>${staff.position}</td>
                <td>${staff.name}</td>
                <td><span class="abnormal-desc" title="${staff.abnormalDesc}">${staff.abnormalDesc}</span></td>
                <td><span class="tag tag-pending">待处理</span></td>
                <td style="display:flex;gap:6px;justify-content:center;">
                    <button class="row-btn handle-btn">处理</button>
                    <button class="row-btn approve-btn">审批</button>
                </td>
            `;
            tbody.appendChild(tr);

            // 处理按钮 - 都能点击打开弹窗
            const handleBtn = tr.querySelector('.handle-btn');
            handleBtn.addEventListener('click', () => openHandleModal(staff));

            // 审批按钮 - 打开相同处理弹窗
            const approveBtn = tr.querySelector('.approve-btn');
            approveBtn.addEventListener('click', () => openHandleModal(staff));
        });
    }

    // ==== 筛选事件 ====
    document.getElementById("searchBtn").addEventListener("click", updateTable);
    document.getElementById("nameInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") updateTable();
    });
    document.getElementById("codeInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") updateTable();
    });
    document.getElementById("companySelect").addEventListener("change", updateTable);
    document.getElementById("attendStatusSelect").addEventListener("change", updateTable);
    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("nameInput").value = "";
        document.getElementById("codeInput").value = "";
        document.getElementById("monthSelect").value = "2026-06";
        document.getElementById("startDate").value = "2026-06-22";
        document.getElementById("endDate").value = "2026-06-22";
        document.getElementById("companySelect").value = "";
        document.getElementById("attendStatusSelect").value = "";
        updateTable();
    });
    document.getElementById("exportBtn").addEventListener("click", () => {
        alert("导出功能：将导出当前异常考勤数据到 Excel 文件");
    });

    // ==== 页面初始化 ====
    window.onload = function () {
        const now = new Date();
        const formatDate = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
        document.getElementById("currentTimeText").innerText = `当前日期：${formatDate}`;
        updateTable();
    };
</script>
</body>
</html>
