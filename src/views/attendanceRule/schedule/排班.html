<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工班次配置数据表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1677ff;
            --danger: #f53f3f;
            --gray-bg: #f7f8fa;
            --border: #e5e7eb;
        }
        body {
            background-color: var(--gray-bg);
            font-size: 14px;
        }
        .page-wrap {
            padding: 24px;
        }
        .table-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .table-header-bar h4 {
            margin: 0;
            font-weight: 500;
        }
        .table {
            background: #fff;
            margin-bottom: 0;
        }
        .table th {
            background-color: #f2f6fc;
            font-weight: 500;
            border-color: var(--border);
            text-align: center;
        }
        .table td {
            border-color: var(--border);
            vertical-align: middle;
            text-align: center;
        }
        .table-hover tbody tr:hover {
            background: #f0f7ff;
        }
        .link-blue {
            color: var(--primary);
            cursor: pointer;
        }
        .link-blue:hover {
            text-decoration: underline;
        }
        .link-red {
            color: var(--danger);
            cursor: pointer;
        }
        .link-red:hover {
            text-decoration: underline;
        }
        .btn-blue {
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
        }
        .btn-blue:hover {
            opacity: 0.9;
        }

        /* 搜索栏 */
        .search-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .search-bar .search-field {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-bar .search-field label {
            font-size: 13px;
            color: #555;
            white-space: nowrap;
        }
        .search-bar .search-field input,
        .search-bar .search-field select {
            padding: 4px 10px;
            font-size: 13px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            height: 32px;
            line-height: 1.2;
            min-width: 120px;
        }
        .search-bar .search-field input:focus,
        .search-bar .search-field select:focus {
            outline: none;
            border-color: #1677ff;
            box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
        }
        .search-bar .btn {
            padding: 5px 18px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            height: 32px;
        }
        .search-bar .btn-search {
            background: #1677ff;
            color: #fff;
            border: none;
        }
        .search-bar .btn-search:hover {
            background: #4096ff;
        }
        .search-bar .btn-reset {
            background: #fff;
            color: #555;
            border: 1px solid #d9d9d9;
        }
        .search-bar .btn-reset:hover {
            border-color: #1677ff;
            color: #1677ff;
        }

        /* 标签样式 */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 20px;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .tag-blue {
            color: #1890ff;
            background: #e6f7ff;
            border-color: #91d5ff;
        }
        .tag-green {
            color: #52c41a;
            background: #f6ffed;
            border-color: #b7eb8f;
        }
        .tag-orange {
            color: #fa8c16;
            background: #fff7e6;
            border-color: #ffd591;
        }
        .tag-purple {
            color: #722ed1;
            background: #f9f0ff;
            border-color: #d3adf7;
        }
        .tag-cyan {
            color: #13c2c2;
            background: #e6fffb;
            border-color: #87e8de;
        }

        /* 弹窗风格：蓝色标题栏 */
        .modal-content {
            border: none;
            border-radius: 8px;
            overflow: hidden;
        }
        .modal-header {
            background: linear-gradient(135deg, #1890ff, #1677ff);
            color: #fff;
            border-bottom: none;
            padding: 14px 20px;
        }
        .modal-header .modal-title {
            color: #fff;
            font-weight: 500;
            font-size: 16px;
        }
        .modal-header .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
            opacity: 1;
            width: 24px;
            height: 24px;
            padding: 0;
            margin: 0;
            background-size: 12px;
        }
        .modal-footer {
            border-top: none;
            padding: 12px 20px 20px;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-footer .btn {
            border-radius: 4px;
            padding: 6px 20px;
            font-size: 14px;
        }
        .modal-footer .btn-outline-secondary {
            border-color: #d9d9d9;
            color: #555;
            background: #fff;
        }
        .modal-footer .btn-outline-secondary:hover {
            border-color: #1677ff;
            color: #1677ff;
            background: #fff;
        }
        .modal-footer .btn-primary {
            background: #1677ff;
            border-color: #1677ff;
        }
        .modal-footer .btn-primary:hover {
            background: #4096ff;
            border-color: #4096ff;
        }
        /* 添加按钮 */
        .add-shift-btn {
            color: #1677ff;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            padding: 0;
            margin-top: 4px;
        }
        .add-shift-btn:hover {
            opacity: 0.85;
        }

        /* 日历弹窗 */
        .calendar-modal .modal-dialog {
            max-width: 720px;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
        }
        .calendar-header h5 {
            margin: 0;
            color: #333;
            font-weight: 600;
            font-size: 20px;
        }
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            position: absolute;
            right: 0;
        }
        .calendar-nav button:first-child {
            position: absolute;
            right: 40px;
        }
        .calendar-nav button:last-child {
            position: absolute;
            right: 0;
        }
        .calendar-nav button {
            background: none;
            border: none;
            color: #1677ff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .calendar-nav button:hover {
            background: #e6f7ff;
            color: #0958d9;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .calendar-weekday {
            text-align: center;
            font-size: 13px;
            color: #888;
            padding: 6px 0;
            font-weight: 500;
        }
        .calendar-day {
            min-height: 80px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 6px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
        }
        .calendar-day .day-num {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            align-self: center;
            margin: 0 auto;
        }
        .calendar-day .day-num.today {
            background: #e6f7ff;
            color: #1890ff;
        }
        .calendar-day.weekend {
            background: #e6f0ff;
            border-color: #b3d4ff;
        }
        .calendar-day.weekend .day-num {
            color: #1a73e8;
        }
        .calendar-day .day-num.rest-day {
            color: #1a73e8;
        }
        .calendar-day .day-tag {
            font-size: 11px;
            padding: 1px 4px;
            border-radius: 3px;
            line-height: 16px;
            margin-top: 4px;
            align-self: flex-start;
        }
        .calendar-day .day-tag.rest {
            color: #999;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
        }
        .calendar-day .day-tag.shift-morning {
            color: #fa8c16;
            background: #fff7e6;
            border: 1px solid #ffd591;
        }
        .calendar-day .day-tag.shift-noon {
            color: #52c41a;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
        }
        .calendar-day .day-tag.shift-night {
            color: #722ed1;
            background: #f9f0ff;
            border: 1px solid #d3adf7;
        }
        .calendar-day.empty {
            background: transparent;
            border: none;
        }
        .calendar-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #f7f8fa;
            border-radius: 6px;
        }

        /* 排班时段区域 - 左右两栏 */
        .shift-area {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .shift-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 80px;
            flex-shrink: 0;
        }
        .shift-add-btn {
            padding: 6px 4px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            background: #fff;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            white-space: nowrap;
        }
        .shift-add-btn:hover {
            border-color: #1677ff;
            color: #1677ff;
            background: #e6f7ff;
        }
        .shift-add-btn:active {
            transform: scale(0.96);
        }
        .shift-add-btn.morning { border-color: #ffa940; color: #fa8c16; background: #fff7e6; }
        .shift-add-btn.noon { border-color: #73d13d; color: #52c41a; background: #f6ffed; }
        .shift-add-btn.night { border-color: #9254de; color: #722ed1; background: #f9f0ff; }

        .shift-right {
            flex: 1;
            min-width: 0;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .shift-right::-webkit-scrollbar {
            width: 6px;
        }
        .shift-right::-webkit-scrollbar-thumb {
            background: #c0c4cc;
            border-radius: 3px;
        }
        .shift-right-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* 排班时段行 */
        .shift-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            padding: 5px 6px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #eef0f2;
            overflow: hidden;
        }
        .shift-row .shift-tag-label {
            width: 42px;
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            padding: 3px 0;
            border-radius: 4px;
            flex-shrink: 0;
            color: #fff;
        }
        .shift-row .shift-tag-label.morning { background: #fa8c16; }
        .shift-row .shift-tag-label.noon { background: #52c41a; }
        .shift-row .shift-tag-label.night { background: #722ed1; }
        .shift-row .shift-remove {
            flex-shrink: 0;
            font-size: 12px;
            padding: 2px 6px;
            line-height: 1;
        }
        .shift-row .date-field {
            flex: 1;
            min-width: 70px;
            max-width: 120px;
        }
        .shift-row .date-field input {
            padding: 2px 4px;
            font-size: 12px;
            height: 26px;
            width: 100%;
        }
        .shift-row .date-sep {
            flex-shrink: 0;
            font-size: 11px;
            color: #999;
            padding: 0 2px;
            line-height: 26px;
            align-self: center;
        }

        /* 未来7天班次列 */
        .day-col {
            min-width: 70px;
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
        }
        .day-shift-cell {
            text-align: center;
            padding: 4px 2px !important;
            vertical-align: middle;
        }
        .day-shift-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .day-shift-tag.morning {
            color: #fa8c16;
            background: #fff7e6;
            border: 1px solid #ffd591;
        }
        .day-shift-tag.noon {
            color: #52c41a;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
        }
        .day-shift-tag.night {
            color: #722ed1;
            background: #f9f0ff;
            border: 1px solid #d3adf7;
        }
        .day-shift-tag.rest {
            color: #999;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
        }
        /* 弹窗板块 */
        .modal-panel {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            background: #fff;
        }
        .modal-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-left: 8px;
            border-left: 3px solid #1677ff;
        }

        /* 编辑弹窗左右布局 */
        .edit-modal-dialog {
            max-width: 1080px!important;
        }
        .edit-modal-body {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            max-height: 520px;
            overflow: hidden;
        }
        .edit-left {
            width: 50%;
            flex-shrink: 0;
            padding-right: 4px;
        }
        .edit-right {
            width: 50%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #e8e8e8;
            padding-left: 16px;
        }
        .edit-left .form-control,
        .edit-left .form-select {
            padding: 3px 8px;
            font-size: 13px;
            height: 30px;
            line-height: 1.2;
        }
        .edit-left .form-label {
            font-size: 12px;
            margin-bottom: 3px;
        }
        .edit-left .row {
            margin-bottom: 6px !important;
        }
        .edit-right .calendar-header {
            margin-bottom: 4px;
        }
        .edit-right .calendar-header h5 {
            font-size: 14px;
        }
        .edit-right .calendar-nav button {
            font-size: 14px;
            padding: 2px 6px;
        }
        .edit-right .calendar-grid {
            grid-template-columns: repeat(7, 1fr);
            font-size: 11px;
            gap: 4px;
        }
        .edit-right .calendar-weekday {
            font-size: 10px;
            padding: 2px 0;
        }
        .edit-right .calendar-day {
            min-height: 28px;
            padding: 1px;
        }
        .edit-right .calendar-day .day-num {
            font-size: 10px;
            width: 20px;
            height: 20px;
            margin-bottom: 0;
        }
        .edit-right .calendar-day .day-tag {
            font-size: 10px;
            padding: 0px 2px;
            margin-top: 1px;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <!-- 搜索栏 -->
    <div class="search-bar">
        <div class="search-field">
            <label>姓名</label>
            <input type="text" id="searchName" placeholder="请输入姓名">
        </div>
        <div class="search-field">
            <label>工号</label>
            <input type="text" id="searchEmpNo" placeholder="请输入工号">
        </div>
        <div class="search-field">
            <label>公司</label>
            <input type="text" id="searchCompany" placeholder="请输入公司">
        </div>
        <div class="search-field">
            <label>部门</label>
            <input type="text" id="searchDept" placeholder="请输入部门">
        </div>
        <button type="button" class="btn btn-search" onclick="doSearch()">查询</button>
        <button type="button" class="btn btn-reset" onclick="resetSearch()">重置</button>
    </div>

    <!-- 数据表 -->
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th width="45"><input type="checkbox"></th>
                    <th>工号</th>
                    <th>姓名</th>
                    <th>公司</th>
                    <th>部门</th>
                    <th>岗位</th>
                    <th class="day-col" id="day0">周一</th>
                    <th class="day-col" id="day1">周二</th>
                    <th class="day-col" id="day2">周三</th>
                    <th class="day-col" id="day3">周四</th>
                    <th class="day-col" id="day4">周五</th>
                    <th class="day-col" id="day5">周六</th>
                    <th class="day-col" id="day6">周日</th>
                    <th width="100">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg edit-modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">班次配置编辑</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body edit-modal-body">
                <div class="edit-left" style="display:flex;flex-direction:column;gap:14px">
                    <form id="formData" onsubmit="return false;">
                        <input type="hidden" id="rowIndex">

                        <!-- 板块1：基本信息 -->
                        <div class="modal-panel" style="margin-bottom:0">
                            <div class="modal-panel-title">基本信息</div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label">工号</label>
                                    <input type="text" class="form-control" id="empNo" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">姓名</label>
                                    <input type="text" class="form-control" id="empName" required>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label">公司</label>
                                    <input type="text" class="form-control" id="company" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">部门</label>
                                    <input type="text" class="form-control" id="dept" required>
                                </div>
                            </div>
                            <div class="row mb-0">
                                <div class="col-6">
                                    <label class="form-label">岗位</label>
                                    <input type="text" class="form-control" id="position" required>
                                </div>
                            </div>
                        </div>
                    </form>

                    <!-- 板块2：排班时段 -->
                    <div class="modal-panel" style="margin-bottom:0;flex:1;display:flex;flex-direction:column">
                        <div class="modal-panel-title">排班时段</div>
                        <div class="shift-area" style="gap:14px;flex:1">
                            <div class="shift-left modal-panel" style="margin-bottom:0;min-height:160px;padding:14px 10px">
                                <button type="button" class="shift-add-btn morning" onclick="addShiftRow('白班')">+ 白班</button>
                                <button type="button" class="shift-add-btn noon"   onclick="addShiftRow('中班')">+ 中班</button>
                                <button type="button" class="shift-add-btn night"  onclick="addShiftRow('夜班')">+ 夜班</button>
                            </div>
                            <div class="shift-right modal-panel" style="margin-bottom:0;max-height:260px;overflow-y:auto;padding:10px 14px;flex:1">
                                <div class="shift-right-label">已添加时段</div>
                                <div id="shiftRows">
                                    <!-- 动态生成时段行 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="edit-right" style="display:flex;flex-direction:column">
                    <!-- 板块3：日历预览 -->
                    <div class="modal-panel" style="margin-bottom:0;flex:1;display:flex;flex-direction:column">
                        <div class="modal-panel-title">日历预览</div>
                        <div class="calendar-header" style="margin-bottom:4px">
                            <div class="calendar-nav" style="position:static;flex:1;justify-content:flex-start">
                                <button type="button" onclick="changeMonth(-1)" style="position:static">&lt;</button>
                            </div>
                            <h5 id="edit-calendarMonth" style="font-size:14px"></h5>
                            <div class="calendar-nav" style="position:static;flex:1;justify-content:flex-end">
                                <button type="button" onclick="changeMonth(1)" style="position:static">&gt;</button>
                            </div>
                        </div>
                        <div class="calendar-grid" id="edit-calendarGrid" style="flex:1">
                            <div class="calendar-weekday">日</div>
                            <div class="calendar-weekday">一</div>
                            <div class="calendar-weekday">二</div>
                            <div class="calendar-weekday">三</div>
                            <div class="calendar-weekday">四</div>
                            <div class="calendar-weekday">五</div>
                            <div class="calendar-weekday">六</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 日历弹窗 -->
<div class="modal fade calendar-modal" id="calendarModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">日历视图</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="calendar-info" id="calendarInfo"></div>
                <div class="calendar-header">
                    <div class="calendar-nav" style="position:static;flex:1;justify-content:flex-start">
                        <button type="button" onclick="changeMonth(-1)" style="position:static">&lt;</button>
                    </div>
                    <h5 id="calendarMonth"></h5>
                    <div class="calendar-nav" style="position:static;flex:1;justify-content:flex-end">
                        <button type="button" onclick="changeMonth(1)" style="position:static">&gt;</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- 星期标题 -->
                    <div class="calendar-weekday">日</div>
                    <div class="calendar-weekday">一</div>
                    <div class="calendar-weekday">二</div>
                    <div class="calendar-weekday">三</div>
                    <div class="calendar-weekday">四</div>
                    <div class="calendar-weekday">五</div>
                    <div class="calendar-weekday">六</div>
                    <!-- 日期由JS生成 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let tableData = [
        {
            type: "固定班次", empNo: "E001", empName: "张三", company: "强瑞卡仕标", dept: "工艺编程组", position: "CNC编程工程师",
            shifts: [
                { type: "白班", start: "2026-07-01", end: "2026-07-10" },
                { type: "中班", start: "2026-07-11", end: "2026-07-20" },
                { type: "夜班", start: "2026-07-21", end: "2026-07-31" }
            ]
        },
        {
            type: "轮换班次", empNo: "E002", empName: "李四", company: "深圳国瑞&郑州", dept: "市场运营部", position: "运营总监",
            shifts: [
                { type: "白班", start: "2026-01-01", end: "2026-04-30" },
                { type: "中班", start: "2026-05-01", end: "2026-08-31" },
                { type: "夜班", start: "2026-09-01", end: "2026-12-31" }
            ]
        },
        {
            type: "固定班次", empNo: "E003", empName: "王五", company: "强瑞卡仕标", dept: "生产制造部", position: "铣床操作员",
            shifts: [
                { type: "中班", start: "2026-01-01", end: "2026-12-31" }
            ]
        },
        {
            type: "固定班次", empNo: "E004", empName: "赵六", company: "深圳国瑞&郑州", dept: "品质管理部", position: "质检工程师",
            shifts: [
                { type: "夜班", start: "2026-01-01", end: "2026-12-31" }
            ]
        },
        {
            type: "轮换班次", empNo: "E005", empName: "孙七", company: "强瑞卡仕标", dept: "工艺编程组", position: "编程技术员",
            shifts: [
                { type: "白班", start: "2026-01-01", end: "2026-03-31" },
                { type: "中班", start: "2026-04-01", end: "2026-06-30" },
                { type: "夜班", start: "2026-07-01", end: "2026-09-30" }
            ]
        },
        {
            type: "固定班次", empNo: "E006", empName: "周八", company: "深圳国瑞&郑州", dept: "市场运营部", position: "市场专员",
            shifts: [
                { type: "白班", start: "2026-01-01", end: "2026-12-31" }
            ]
        },
        {
            type: "轮换班次", empNo: "E007", empName: "吴九", company: "强瑞卡仕标", dept: "生产制造部", position: "CNC操作员",
            shifts: [
                { type: "夜班", start: "2026-01-01", end: "2026-06-30" },
                { type: "白班", start: "2026-07-01", end: "2026-12-31" }
            ]
        },
        {
            type: "固定班次", empNo: "E008", empName: "郑十", company: "深圳国瑞&郑州", dept: "品质管理部", position: "测试工程师",
            shifts: [
                { type: "中班", start: "2026-01-01", end: "2026-12-31" }
            ]
        },
        {
            type: "轮换班次", empNo: "E009", empName: "陈十一", company: "强瑞卡仕标", dept: "工艺编程组", position: "CAM工程师",
            shifts: [
                { type: "白班", start: "2026-01-01", end: "2026-02-28" },
                { type: "中班", start: "2026-03-01", end: "2026-04-30" },
                { type: "白班", start: "2026-05-01", end: "2026-12-31" }
            ]
        },
        {
            type: "固定班次", empNo: "E010", empName: "林十二", company: "深圳国瑞&郑州", dept: "市场运营部", position: "运营专员",
            shifts: [
                { type: "夜班", start: "2026-01-01", end: "2026-12-31" }
            ]
        }
    ];

    function getTypeTag(val) {
        if (val === '固定班次') return `<span class="tag tag-blue">${val}</span>`;
        if (val === '轮换班次') return `<span class="tag tag-green">${val}</span>`;
        return val || '-';
    }
    function getShiftTag(val) {
        if (!val) return '-';
        if (val === '白班') return `<span class="tag tag-orange">${val}</span>`;
        if (val === '中班') return `<span class="tag tag-green">${val}</span>`;
        if (val === '夜班') return `<span class="tag tag-purple">${val}</span>`;
        return val;
    }
    function renderShiftsCell(shifts) {
        if (!shifts || shifts.length === 0) return '-';
        var parts = [];
        for (var i = 0; i < shifts.length; i++) {
            var s = shifts[i];
            var tag = getShiftTag(s.type);
            var rng = (s.start || '-') + ' ~ ' + (s.end || '-');
            parts.push('<div style="white-space:nowrap; margin-bottom:2px">' + tag + ' ' + rng + '</div>');
        }
        return parts.join('');
    }
    function getCompanyTag(val) {
        if (!val) return '-';
        // 显示前6个字符，超出加省略号
        const display = val.length > 6 ? val.substring(0, 6) + '…' : val;
        return `<span class="tag tag-blue">${display}</span>`;
    }

    function getNext7Days() {
        var days = [];
        var today = new Date();
        var weekNames = ['周日','周一','周二','周三','周四','周五','周六'];
        for (var i = 0; i < 7; i++) {
            var d = new Date(today);
            d.setDate(today.getDate() + i);
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var dateStr = y + '-' + m + '-' + day;
            var display = weekNames[d.getDay()] + '(' + d.getDate() + ')';
            days.push({ dateStr: dateStr, display: display });
        }
        return days;
    }

    function renderTable(list) {
        var weekDays = getNext7Days();
        // 更新表头日期
        for (var i = 0; i < 7; i++) {
            var th = document.getElementById('day' + i);
            if (th) th.textContent = weekDays[i].display;
        }

        var tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        list.forEach((item, idx) => {
            let tr = document.createElement("tr");
            var html = `
                <td><input type="checkbox"></td>
                <td>${item.empNo}</td>
                <td>${item.empName}</td>
                <td>${getCompanyTag(item.company)}</td>
                <td>${item.dept}</td>
                <td>${item.position}</td>`;
            for (var i = 0; i < 7; i++) {
                // 周六(5)和周日(6)显示休息
                if (i === 5 || i === 6) {
                    html += '<td class="day-shift-cell"><span class="day-shift-tag rest">休息</span></td>';
                } else {
                    var shift = getShiftForDate(item, weekDays[i].dateStr);
                    var tagCls = shift.cls === 'shift-morning' ? 'morning' :
                                 shift.cls === 'shift-noon' ? 'noon' :
                                 shift.cls === 'shift-night' ? 'night' : 'rest';
                    html += `<td class="day-shift-cell"><span class="day-shift-tag ${tagCls}">${shift.name}</span></td>`;
                }
            }
            html += `<td>
                    <span class="link-blue me-2" onclick="editRow(${idx})">排班</span>
                    <span class="link-red" onclick="delRow(${idx})">删除</span>
                </td>`;
            tr.innerHTML = html;
            tbody.appendChild(tr);
        })
    }

    function addShiftRow(type, start, end) {
        type = type || '白班';
        start = start || '';
        end = end || '';
        var container = document.getElementById('shiftRows');
        var row = document.createElement('div');
        row.className = 'shift-row';
        var tagCls = type === '白班' ? 'morning' : type === '中班' ? 'noon' : 'night';
        row.innerHTML =
            '<div class="shift-tag-label ' + tagCls + '">' + type + '</div>' +
            '<div class="date-field">' +
                '<input type="date" class="form-control shift-start" placeholder="开始日期" value="' + start + '">' +
            '</div>' +
            '<div class="date-sep">至</div>' +
            '<div class="date-field">' +
                '<input type="date" class="form-control shift-end" placeholder="结束日期" value="' + end + '">' +
            '</div>' +
            '<button type="button" class="btn btn-sm btn-link text-danger shift-remove" style="font-size:12px;text-decoration:none" onclick="removeShiftRow(this)">删除</button>';
        container.appendChild(row);
    }

    function removeShiftRow(btn) {
        var container = document.getElementById('shiftRows');
        if (container.children.length <= 1) {
            alert('至少保留一个排班时段');
            return;
        }
        btn.parentElement.remove();
    }

    function editRow(i) {
        var row = tableData[i];
        document.getElementById('rowIndex').value = i;
        document.getElementById('empNo').value = row.empNo;
        document.getElementById('empName').value = row.empName;
        document.getElementById('company').value = row.company;
        document.getElementById('dept').value = row.dept;
        document.getElementById('position').value = row.position;

        // 重建时段行
        var container = document.getElementById('shiftRows');
        container.innerHTML = '';
        var shifts = row.shifts || [];
        if (shifts.length > 0) {
            for (var j = 0; j < shifts.length; j++) {
                addShiftRow(shifts[j].type, shifts[j].start, shifts[j].end);
            }
        } else {
            addShiftRow('白班', '', '');
        }

        // 初始化嵌入日历 - 默认显示当前月份
        calendarPrefix = 'edit-';
        calendarRow = row;
        var now = new Date();
        calendarYear = now.getFullYear();
        calendarMonth = now.getMonth();

        var modal = new bootstrap.Modal(document.getElementById('editModal'));
        modal.show();
        setTimeout(function() { renderCalendar(); }, 50);
    }

    function delRow(i) {
        if (confirm("确定删除该条排班数据？")) {
            tableData.splice(i, 1);
            renderTable(tableData);
        }
    }

    function saveData() {
        var idx = document.getElementById('rowIndex').value;
        // 收集所有时段行
        var shiftRows = document.querySelectorAll('#shiftRows .shift-row');
        var shifts = [];
        for (var j = 0; j < shiftRows.length; j++) {
            var row = shiftRows[j];
            var labelEl = row.querySelector('.shift-tag-label');
            var type = labelEl ? labelEl.textContent.trim() : '白班';
            var start = row.querySelector('.shift-start').value;
            var end = row.querySelector('.shift-end').value;
            shifts.push({ type: type, start: start, end: end });
        }
        var typeVal = '';
        var idx2 = Number(idx);
        if (idx2 >= 0 && idx2 < tableData.length) {
            typeVal = tableData[idx2].type || '固定班次';
        } else {
            typeVal = '固定班次';
        }
        var obj = {
            type: typeVal,
            empNo: document.getElementById('empNo').value,
            empName: document.getElementById('empName').value,
            company: document.getElementById('company').value,
            dept: document.getElementById('dept').value,
            position: document.getElementById('position').value,
            shifts: shifts
        };
        if (idx === '') {
            tableData.push(obj);
        } else {
            tableData[Number(idx)] = obj;
        }
        renderTable(tableData);
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    }

    let calendarRow = null;
    let calendarYear = 2026;
    let calendarMonth = 6; // 0-based, 6 = July
    let calendarModal = null;
    let calendarPrefix = ''; // ''=独立弹窗, 'edit-'=编辑弹窗内嵌

    function formatDateNum(y, m, d) {
        var mm = (m + 1) < 10 ? '0' + (m + 1) : '' + (m + 1);
        var dd = d < 10 ? '0' + d : '' + d;
        return y + '-' + mm + '-' + dd;
    }

    function getShiftForDate(row, dateStr) {
        var shifts = row.shifts || [];
        for (var i = 0; i < shifts.length; i++) {
            var s = shifts[i];
            if (s.start && s.end && dateStr >= s.start && dateStr <= s.end) {
                var cls = s.type === '白班' ? 'shift-morning' : s.type === '中班' ? 'shift-noon' : 'shift-night';
                return { name: s.type, cls: cls };
            }
        }
        return { name: '休', cls: 'rest' };
    }

    function openCalendar(idx) {
        calendarRow = tableData[idx];
        calendarPrefix = '';
        var firstDate = null;
        if (calendarRow.shifts && calendarRow.shifts.length > 0) {
            for (var k = 0; k < calendarRow.shifts.length; k++) {
                if (calendarRow.shifts[k].start) { firstDate = calendarRow.shifts[k].start; break; }
            }
        }
        if (firstDate) {
            var d = new Date(firstDate + 'T00:00:00');
            calendarYear = d.getFullYear();
            calendarMonth = d.getMonth();
        } else {
            var now = new Date();
            calendarYear = now.getFullYear();
            calendarMonth = now.getMonth();
        }
        calendarModal = new bootstrap.Modal(document.getElementById('calendarModal'));
        calendarModal.show();
        setTimeout(function() { renderCalendar(); }, 50);
    }

    function changeMonth(dir) {
        calendarMonth += dir;
        if (calendarMonth > 11) {
            calendarMonth = 0;
            calendarYear++;
        } else if (calendarMonth < 0) {
            calendarMonth = 11;
            calendarYear--;
        }
        renderCalendar();
    }

    function renderCalendar() {
        var pf = calendarPrefix || '';
        var info = document.getElementById(pf + 'calendarInfo');
        if (info && calendarRow) {
            info.textContent = '员工：' + (calendarRow.empName || '') + '（' + (calendarRow.empNo || '') + '）| 公司：' + (calendarRow.company || '');
        }

        var monthStr = (calendarMonth + 1) < 10 ? '0' + (calendarMonth + 1) : '' + (calendarMonth + 1);
        var monthEl = document.getElementById(pf + 'calendarMonth');
        if (monthEl) monthEl.textContent = calendarYear + '-' + monthStr;

        var grid = document.getElementById(pf + 'calendarGrid');
        if (!grid) return;

        // 完全清空并重新创建所有元素
        grid.innerHTML = '';

        var weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        for (var i = 0; i < weekDays.length; i++) {
            var el = document.createElement('div');
            el.className = 'calendar-weekday';
            el.textContent = weekDays[i];
            grid.appendChild(el);
        }

        var firstDay = new Date(calendarYear, calendarMonth, 1);
        var startDayOfWeek = firstDay.getDay(); // 0=Sun
        var daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

        var today = new Date();
        var isCurrentMonth = today.getFullYear() === calendarYear && today.getMonth() === calendarMonth;
        var todayDate = today.getDate();

        // 空白填充
        for (var i = 0; i < startDayOfWeek; i++) {
            var empty = document.createElement('div');
            empty.className = 'calendar-day empty';
            grid.appendChild(empty);
        }

        for (var d = 1; d <= daysInMonth; d++) {
            var dateStr = formatDateNum(calendarYear, calendarMonth, d);
            var shift = getShiftForDate(calendarRow, dateStr);
            var dayIndex = (startDayOfWeek + d - 1) % 7;
            var isWeekend = dayIndex === 0 || dayIndex === 6;

            var cell = document.createElement('div');
            cell.className = 'calendar-day';
            if (isWeekend) cell.classList.add('weekend');

            var numClass = 'day-num';
            if (isCurrentMonth && d === todayDate) numClass += ' today';
            if (isWeekend) numClass += ' rest-day';

            var html = '<div class="' + numClass + '">' + d + '</div>';
            if (isWeekend) {
                html += '<div class="day-tag rest">休息</div>';
            } else {
                html += '<div class="day-tag ' + shift.cls + '">' + shift.name + '</div>';
            }
            cell.innerHTML = html;
            grid.appendChild(cell);
        }
    }

    function doSearch() {
        var name = document.getElementById('searchName').value.trim().toLowerCase();
        var empNo = document.getElementById('searchEmpNo').value.trim().toLowerCase();
        var company = document.getElementById('searchCompany').value.trim().toLowerCase();
        var dept = document.getElementById('searchDept').value.trim().toLowerCase();

        var filtered = tableData.filter(function(item) {
            if (name && !item.empName.toLowerCase().includes(name)) return false;
            if (empNo && !item.empNo.toLowerCase().includes(empNo)) return false;
            if (company && !item.company.toLowerCase().includes(company)) return false;
            if (dept && !item.dept.toLowerCase().includes(dept)) return false;
            return true;
        });

        renderTable(filtered);
    }

    function resetSearch() {
        document.getElementById('searchName').value = '';
        document.getElementById('searchEmpNo').value = '';
        document.getElementById('searchCompany').value = '';
        document.getElementById('searchDept').value = '';
        renderTable(tableData);
    }

    renderTable(tableData);
</script>
