
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡记录统计面板</title>
<style>
:root {
  --bg: #f0f4f8;
  --card-bg: #ffffff;
  --text: #1e2d3d;
  --text-secondary: #6b7c93;
  --primary: #2d78ff;
  --primary-light: rgba(45,120,255,0.08);
  --success: #10b981;
  --success-light: #ecfdf5;
  --warning: #d97706;
  --warning-light: #fffbeb;
  --danger: #dc2626;
  --danger-light: #fef2f2;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.04);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 100%; margin: 0; padding: 12px 18px; }
.header {
  background: linear-gradient(135deg, #2d78ff 0%, #00b4d8 100%);
  color: #fff;
  padding: 18px 28px;
  border-radius: var(--radius);
  margin-bottom: 14px;
  box-shadow: 0 4px 20px rgba(45,120,255,0.25), 0 0 40px rgba(45,120,255,0.08);
}
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.header p { margin-top: 4px; font-size: 13px; opacity: 0.85; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 10px 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.stat-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
.stat-card .value { font-size: 26px; font-weight: 700; letter-spacing: -1px; }
.stat-card .sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.stat-card.primary .value { color: var(--primary); }
.stat-card.success .value { color: var(--success); }
.stat-card.warning .value { color: var(--warning); }
.section {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 14px;
  overflow: hidden;
}
.section-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.section-header h2 { font-size: 13px; font-weight: 600; }
.section-body { padding: 16px 20px; }
.chart-wrapper { position: relative; width: 100%; min-height: 220px; }
.chart-wrapper.compact { min-height: 180px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }
@media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  position: sticky; top: 0; background: #f8fafc; padding: 10px 12px;
  text-align: left; font-weight: 600; color: var(--text-secondary);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 2px solid var(--border); white-space: nowrap;
}
tbody td { padding: 8px 12px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
tbody tr:hover { background: rgba(45,120,255,0.03); }
tbody tr:last-child td { border-bottom: none; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-in { background: rgba(45,120,255,0.08); color: var(--primary); }
.badge-out { background: var(--primary-light); color: var(--primary); }
.badge-machine { background: #f3f4f6; color: #374151; }
.badge-wechat { background: #ecfdf5; color: #059669; }
.badge-manual { background: #fffbeb; color: #d97706; }
.badge-invalid { background: #fef2f2; color: #dc2626; }
.badge-location { background: #fef3c7; color: #92400e; font-size: 11px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filter-bar select, .filter-bar input {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 12px; background: #fff; color: var(--text); outline: none; transition: var(--transition);
}
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.filter-bar input { width: 180px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); padding: 0 20px; }
.tab-btn {
  padding: 8px 16px; border: none; background: none; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); cursor: pointer; position: relative; transition: var(--transition);
}
.tab-btn.active { color: var(--primary); }
.tab-btn.active::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
  background: var(--primary); border-radius: 1px;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.pagination button {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: #fff; font-size: 12px; cursor: pointer; transition: var(--transition); color: var(--text);
}
.pagination button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination .info { font-size: 12px; color: var(--text-secondary); margin-left: 8px; }
.rank-list { list-style: none; }
.rank-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f3f4f6; gap: 10px; }
.rank-item:last-child { border-bottom: none; }
.rank-num {
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 12px; font-weight: 700; background: #f3f4f6;
  color: var(--text-secondary); flex-shrink: 0;
}
.rank-item:nth-child(1) .rank-num { background: #fef3c7; color: #92400e; }
.rank-item:nth-child(2) .rank-num { background: #e5e7eb; color: #374151; }
.rank-item:nth-child(3) .rank-num { background: #fed7aa; color: #9a3412; }
.rank-name { flex: 1; font-size: 13px; font-weight: 500; }
.rank-count { font-size: 13px; font-weight: 600; color: var(--primary); white-space: nowrap; }
.rank-bar-wrap { flex: 1; max-width: 120px; }
.rank-bar { height: 5px; background: var(--primary-light); border-radius: 3px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7c3aed); border-radius: 3px; transition: width 0.6s ease; }
.method-list { display: flex; gap: 16px; flex-wrap: wrap; }
.method-item { display: flex; align-items: center; gap: 4px; padding: 2px 6px; background: #f9fafb; border-radius: var(--radius-sm); }
.method-dot { width: 7px; height: 7px; border-radius: 50%; }
.method-label { font-size: 10px; color: var(--text-secondary); }
.method-val { font-size: 12px; font-weight: 700; }
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
.empty { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; }
.loading-mask {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
  z-index: 9999; font-size: 16px; color: var(--primary);
}
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--primary-light);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.page-size-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.page-size-wrap select { padding: 4px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
</style>

<div class="container">

      </div>
    </div>
  </div>

  <div class="section">
    <div class="tabs">
      <button class="tab-btn active" data-tab="records">打卡记录明细</button>
      <button class="tab-btn" data-tab="ranking">打卡次数排行</button>
      <button class="tab-btn" data-tab="employee">员工出勤概览</button>
      <button class="tab-btn" data-tab="locations">打卡地点 TOP</button>
    </div>

    <div class="tab-content active" id="tab-records">
      <div class="section-body" style="padding-top:14px;">
        <div class="filter-bar">

          <select id="filterDate"></select>
          <input type="text" id="filterName" placeholder="搜索员工姓名...">
          <div class="page-size-wrap">
            每页<select id="pageSizeSelect"><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option></select>条
          </div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>员工编号</th><th>姓名</th><th>日期</th><th>时间</th><th>打卡方式</th><th>类型</th><th>地点</th></tr></thead><tbody id="recordsBody"></tbody></table></div>
        <div class="pagination" id="recordsPagination"></div>
      </div>
    </div>

    <div class="tab-content" id="tab-ranking">
      <div class="section-body"><ul class="rank-list" id="rankList"></ul></div>
    </div>

    <div class="tab-content" id="tab-employee">
      <div class="section-body" style="padding-top:14px;">
        <div class="filter-bar">
          <input type="text" id="empFilterName" placeholder="搜索员工姓名...">
        </div>
        <div class="table-wrap"><table><thead><tr><th>员工姓名</th><th>近7天打卡天数</th><th>平均上班时间</th><th>平均下班时间</th></tr></thead><tbody id="empBody"></tbody></table></div>
      </div>
    </div>

    <div class="tab-content" id="tab-locations">
      <div class="section-body"><ul class="rank-list" id="locationList"></ul></div>
    </div>
  </div>
</div>

function renderCharts() {
  var daily = statsData.daily_summary;
  var dates = daily.map(function(d) { return d.date.slice(5); });
  var inData = daily.map(function(d) { return d.in_count; });

  var invalidData = daily.map(function(d) { return d.invalid; });

  var ctx1 = document.getElementById('dailyChart').getContext('2d');
  var maxValid = 0;
  for (var i = 0; i < inData.length; i++) {

  new Chart(ctx1, {

            if (!ca) return 'rgba(45,120,255,0.8)';
            var g = c.createLinearGradient(0, ca.top, 0, ca.bottom);
            g.addColorStop(0, 'rgba(45,120,255,0.9)');
            g.addColorStop(1, 'rgba(45,120,255,0.35)');
            return g;
          }, borderColor: '#2d78ff', borderWidth: 1.5, borderWidth: 1, borderRadius: [4,4,0,0], order: 2 },
        { label: '下班', data: outData, backgroundColor: function(context) {
            var chart = context.chart;
            var c = chart.ctx;
            var ca = chart.chartArea;
            if (!ca) return 'rgba(0,160,212,0.8)';
            var g = c.createLinearGradient(0, ca.top, 0, ca.bottom);
            g.addColorStop(0, 'rgba(0,160,212,0.85)');
            g.addColorStop(1, 'rgba(0,160,212,0.35)');
            return g;
          }, borderColor: '#00a0d4', borderWidth: 1.5, borderWidth: 1, borderRadius: [4,4,0,0], order: 2 },
        { label: '无效', data: invalidData, backgroundColor: 'rgba(209,213,219,0.35)', borderColor: 'rgba(209,213,219,0.5)', borderWidth: 1, borderRadius: 3, order: 1,
          type: 'line', fill: false, tension: 0.3, pointRadius: 2, pointBackgroundColor: 'rgba(156,163,175,0.6)' }

    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { usePointStyle: true, padding: 14, font: { size: 11 } } },
        tooltip: { callbacks: { label: function(ctx) { return ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString(); } } } },
      scales: {

      }
    }
  });

  var methods = statsData.methods;
  var ctx2 = document.getElementById('methodChart').getContext('2d');

  // Build line chart data: daily breakdown per method
  var methodNames = methods.map(function(m) { return m.name; });
  var dailyByMethod = {};
  var allDates = [];

  allRecords.forEach(function(r) {
    if (!r.date || !r.method) return;
    var d = r.date;
    if (allDates.indexOf(d) === -1) allDates.push(d);
  });
  allDates.sort();

  var methodColors = ['#2d78ff', '#f59e0b', '#10b981'];
  var datasets = methods.map(function(m, i) {
    var name = m.name;
    var counts = allDates.map(function(d) { return 0; });
    allRecords.forEach(function(r) {
      if (r.method === name && r.date) {
        var idx = allDates.indexOf(r.date);
        if (idx >= 0) counts[idx]++;

    return {

      maintainAspectRatio: false,

        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 6, font: { size: 10 }, boxWidth: 8 } }
      },
      scales: {
        x: { display: true, ticks: { maxRotation: 45, font: { size: 8 }, maxTicksLimit: 20, autoSkip: true }, grid: { display: false } },

var recordsPage = 1;
var recordsPerPage = 20;
var filteredRecords = [];

function getTypeBadge(type) {
  if (type === '上班') return '<span class="badge badge-in">上班</span>';
  if (type === '下班') return '<span class="badge badge-out">下班</span>';
  if (type === '无效') return '<span class="badge badge-invalid">无效</span>';
  return '<span class="badge badge-machine">' + type + '</span>';
}

function getMethodBadge(method) {
  if (method === '企业微信') return '<span class="badge badge-wechat">企业微信</span>';
  if (method === '手动打卡') return '<span class="badge badge-manual">手动打卡</span>';
  return '<span class="badge badge-machine">考勤机</span>';
}

function truncateLoc(loc) { if (!loc) return '-'; return loc.length > 18 ? loc.slice(0, 18) + '...' : loc; }

function initRecords() {
  filteredRecords = allRecords.slice();
  renderRecords();
  setupFilters();
}

function renderRecords() {
  var tbody = document.getElementById('recordsBody');
  var start = (recordsPage - 1) * recordsPerPage;
  var pageData = filteredRecords.slice(start, start + recordsPerPage);
  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">没有匹配的记录</td></tr>';
    document.getElementById('recordsPagination').innerHTML = '';
    return;
  }
  tbody.innerHTML = pageData.map(function(r) {
    return '<tr><td>' + r.emp_id + '</td><td><strong>' + r.name + '</strong></td><td>' + r.date + '</td><td>' + r.time + '</td><td>' + getMethodBadge(r.method) + '</td><td>' + getTypeBadge(r.type) + '</td><td><span class="badge-location" title="' + (r.location || '') + '">' + truncateLoc(r.location) + '</span></td></tr>';
  }).join('');

  var totalPages = Math.ceil(filteredRecords.length / recordsPerPage);
  var pagHTML = '';
  pagHTML += '<button ' + (recordsPage <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (recordsPage - 1) + ')">上一页</button>';

  var maxVisiblePages = 7;
  var startPage = Math.max(1, recordsPage - Math.floor(maxVisiblePages / 2));
  var endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
  if (endPage - startPage < maxVisiblePages - 1) startPage = Math.max(1, endPage - maxVisiblePages + 1);

  if (startPage > 1) {
    pagHTML += '<button onclick="goPage(1)">1</button>';
    if (startPage > 2) pagHTML += '<span style="color:#9ca3af;font-size:12px;">...</span>';
  }
  for (var p = startPage; p <= endPage; p++) {
    pagHTML += '<button class="' + (p === recordsPage ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) pagHTML += '<span style="color:#9ca3af;font-size:12px;">...</span>';
    pagHTML += '<button onclick="goPage(' + totalPages + ')">' + totalPages + '</button>';
  }

  pagHTML += '<button ' + (recordsPage >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (recordsPage + 1) + ')">下一页</button>';
  pagHTML += '<span class="info">共 ' + filteredRecords.length.toLocaleString() + ' 条 / 第 ' + recordsPage + '/' + totalPages + ' 页</span>';
  document.getElementById('recordsPagination').innerHTML = pagHTML;
}

function goPage(p) {
  recordsPage = p;
  renderRecords();
  window.scrollTo({ top: document.getElementById('tab-records').offsetTop - 80, behavior: 'smooth' });
}

function applyFilters() {
  var type = document.getElementById('filterType').value;
  var method = document.getElementById('filterMethod').value;
  var date = document.getElementById('filterDate').value;
  var name = document.getElementById('filterName').value.trim();
  if (!allRecords) return;
  filteredRecords = allRecords.filter(function(r) {
    if (type && r.type !== type) return false;
    if (method && r.method !== method) return false;
    if (date && r.date !== date) return false;
    if (name && r.name.indexOf(name) === -1) return false;
    return true;
  });
  recordsPage = 1;
  renderRecords();
}

function setupFilters() {
  var sel = document.getElementById('filterDate');
  var dates = statsData.daily_summary.map(function(d) { return d.date; });
  sel.innerHTML = '<option value="">全部日期</option>' + dates.map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');

  document.getElementById('filterType').addEventListener('change', applyFilters);
  document.getElementById('filterMethod').addEventListener('change', applyFilters);
  document.getElementById('filterDate').addEventListener('change', applyFilters);
  document.getElementById('filterName').addEventListener('input', debounce(applyFilters, 250));

  document.getElementById('pageSizeSelect').addEventListener('change', function(e) {
    recordsPerPage = parseInt(e.target.value);
    recordsPage = 1;
    renderRecords();
  });
}

function debounce(fn, delay) {
  var timer = null;
  return function() {
    clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(this, arguments); }, delay);
  };
}

    return '<li class="rank-item"><span class="rank-num">' + (i + 1) + '</span><span class="rank-name">' + e.name + '</span><span class="rank-bar-wrap"><div class="rank-bar"><div class="rank-bar-fill" style="width:' + pct + '%"></div></div></span><span class="rank-count">' + e.count + '次</span></li>';
  }).join('');
}

var filteredEmp = empData.slice();

function renderEmployee() {
  var tbody = document.getElementById('empBody');
  tbody.innerHTML = filteredEmp.map(function(e) {
    return '<tr><td><strong>' + e.name + '</strong></td><td>' + e.days_count + ' 天</td><td>' + e.avg_in_str + '</td><td>' + e.avg_out_str + '</td></tr>';
  }).join('');
}

function filterEmployee() {
  var name = document.getElementById('empFilterName').value.trim();
  filteredEmp = name ? empData.filter(function(e) { return e.name.indexOf(name) !== -1; }) : empData.slice();
  renderEmployee();
}

function renderLocations() {
  var list = document.getElementById('locationList');
  var maxCount = statsData.locations[0].count;
  list.innerHTML = statsData.locations.map(function(l, i) {
    var pct = (l.count / maxCount * 100).toFixed(0);
    return '<li class="rank-item"><span class="rank-num">' + (i + 1) + '</span><span class="rank-name" style="font-size:12px;">' + l.name + '</span><span class="rank-bar-wrap"><div class="rank-bar"><div class="rank-bar-fill" style="width:' + pct + '%"></div></div></span><span class="rank-count">' + l.count + '次</span></li>';
  }).join('');
}

function initTabs() {
  var btns = document.querySelectorAll('.tab-btn');
  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      btns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(function(tc) { tc.classList.remove('active'); });
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  renderStats();
  renderCharts();
  renderRanking();
  renderEmployee();
  renderLocations();
  initTabs();
  document.getElementById('empFilterName').addEventListener('input', filterEmployee);
  initAllData();
});
</script>
</body>
</html>
